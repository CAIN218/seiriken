<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券 スタッフ</title><link rel="stylesheet" href="admin.css?v=19"></head>
<body>
<div id="login" class="login" hidden><div class="box">
  <h3>スタッフ用ログイン</h3>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="loginBtn" class="btn-main full" style="width:100%;min-height:56px">ログイン</button>
</div></div>

<div id="app" hidden>
  <div id="offline" class="offline" hidden>オフラインです（通信が切れています）。操作が反映されない場合があります。</div>
  <div class="topbar"><div class="inner">
    <div class="who-row"><span>スタッフ画面</span><button id="userBtn" class="usrbtn" aria-label="ログアウト">👤 <span id="userName"></span></button></div>
    <div class="slots" id="slots"></div>
    <button id="callNext" class="call btn-main">次の組を呼ぶ</button>
    <div class="bar2">
      <button id="histBtn" class="big2">📋 履歴・検索</button>
      <button id="gearBtn" class="big2">⚙ 設定</button>
    </div>
    <div class="stats" id="stats"></div><div class="avg" id="avgNote"></div>
    <div id="stopNote"></div>
  </div></div>
  <div class="wrap" id="lists"></div>
  <p style="text-align:center;color:#8a93a6;font-size:13px">v19</p>
</div>

<div id="toast" class="toast" hidden></div>

<div id="hist" class="modal big" hidden><div class="sheet">
  <div class="shead"><h3>履歴・検索</h3><button id="hClose2" class="xbtn">閉じる</button></div>
  <div class="box"><input id="hq" type="text" placeholder="番号またはニックネームで検索" autocomplete="off">
    <div class="chips" id="hchips"></div></div>
  <div id="hlist"></div>
  <button id="hClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="acct" class="modal" hidden><div class="sheet">
  <h3>ログイン中のアカウント</h3>
  <div class="box"><div style="font-size:20px;font-weight:800" id="acctName"></div><div style="color:#5a6378" id="acctMail"></div></div>
  <button id="logoutBtn" class="full btn-bad" style="min-height:56px">ログアウトする</button>
  <button id="acctClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="check" class="modal" hidden><div class="sheet">
  <h3>この整理券の状態</h3>
  <div class="box"><input id="chkIn" type="hidden">
  <div id="chkRes"></div></div>
  <button id="chkClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="menu" class="modal big" hidden><div class="sheet">
  <div class="shead"><h3>設定</h3><button id="menuClose2" class="xbtn">閉じる</button></div>
  <div class="box" id="stopBox"></div>
  <div class="box" id="waitBox"></div>
  <div class="box" id="multiBox"></div>
  <div class="box"><button id="csvBtn" class="full">今日の記録をCSVでダウンロード</button></div>
  <div class="box"><div style="font-weight:800">テスト用の整理券の削除</div>
    <div style="font-size:14px;color:#5a6378">お客さん画面のURLの末尾に <b>?test=1</b> を付けて発行した整理券だけを削除します。</div>
    <button id="testDel" class="full btn-warn">テスト用の整理券を削除する</button></div>
  <div class="box"><div style="font-weight:800">すべてリセット</div>
    <div style="font-size:14px;color:#5a6378">今日の整理券をすべて削除し、番号を1番に戻します。実行するには「リセット」と入力してください。</div>
    <input id="resetIn" type="text" placeholder="リセット" autocomplete="off">
    <button id="resetBtn" class="full btn-bad" disabled>すべてリセットする</button></div>
  <button id="menuClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=19"></script><script src="common.js?v=19"></script>
<script>
const auth = firebase.auth();
const $ = id => document.getElementById(id);
const counter = () => db.collection('counters').doc(today());
const del = () => firebase.firestore.FieldValue.delete();
let list = [], cfg = {}, unsub = null, unsubCnt = null, cachedSince = 0;
let holdEl = null, holdTimer = null, pendingRender = false;
const label = t => `${t.name ? esc(t.name) : '（名前なし）'} <small>${t.people}名</small>`;
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const fmtT = ms => ms ? new Date(ms).toLocaleTimeString('ja-JP', { hour12: false }) : '';

const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + '秒'; const m = Math.floor(s / 60), r = s % 60; return m + '分' + (r ? r + '秒' : ''); };
// その整理券が終わった（または今の）時刻
const endOf = t => isDone(t) ? (t.enteredAt || Date.now()) : t.status === 'absent' ? (t.absentAt || null) : t.status === 'cancelled' ? (t.cancelledAt || null) : Date.now();
const isInvalid = t => t.status === 'absent' || t.status === 'cancelled';
const stateName = t => isDone(t) ? '入室済み' : isSkipped(t) ? '飛ばし中' : t.status === 'called' ? '呼び出し中' : t.status === 'waiting' ? '順番待ち' :  t.status === 'cancelled' ? 'キャンセル' : '欠席';
function reasonOf(t) {
  if (t.status === 'cancelled') return t.cancelledBy === 'staff' ? 'スタッフがキャンセルしました' : 'お客さんが自分でキャンセルしました';
  if (t.status === 'absent') return 'スタッフが欠席にしました' + (t.absentFrom === 'called' ? '（呼び出したが来なかった）' : t.absentFrom === 'waiting' ? '（順番待ちのとき）' : t.absentFrom === 'skipped' ? '（飛ばし中に、呼び出したが来なかった）' : '');
  return '';
}
// 一覧に出す短い説明
function outline(t) {
  const end = endOf(t), made = t.createdAt;
  if (isDone(t)) return `${fmtT(t.enteredAt)}に入室` + (made && t.calledAt ? `　呼ばれるまで${fmtDur(t.calledAt - made)}` : '');
  if (isSkipped(t)) return `${fmtT(t.calledAt)}に呼び出し　飛ばし中`;
  if (t.status === 'called') return `${fmtT(t.calledAt)}に呼び出し`;
  if (t.status === 'waiting') return made ? `${fmtT(made)}に発行　待機中${fmtDur(Date.now() - made)}` : '';
  return `${t.status === 'cancelled' ? 'お客さんがキャンセル' : 'スタッフが欠席にした'}` + (made && end ? `　待ち${fmtDur(end - made)}` : '');
}
// 詳しい経過
function detailHtml(t) {
  const rows = [], end = endOf(t), made = t.createdAt;
  const add = (k, v) => rows.push(`<tr><th>${k}</th><td>${v}</td></tr>`);
  if (isInvalid(t)) add('無効になった理由', `<b style="color:var(--bad)">${reasonOf(t)}</b>`);
  if (made) add('発行', fmtT(made));
  if (t.calledAt) add('呼び出し', fmtT(t.calledAt));
  if (isDone(t)) add('入室', fmtT(t.enteredAt) + (t.torn ? '（お客さんがもぎり）' : '（スタッフが操作）'));
  if (t.status === 'absent') add('欠席にした時刻', t.absentAt ? fmtT(t.absentAt) : '記録なし');
  if (t.status === 'cancelled') add('キャンセルした時刻', t.cancelledAt ? fmtT(t.cancelledAt) : '記録なし');
  if (made && (t.calledAt || end)) add('待った時間', fmtDur((t.calledAt || end) - made) + (t.calledAt ? '（発行→呼び出し）' : isInvalid(t) ? '（発行→無効になるまで）' : '（発行から今まで）'));
  if (t.calledAt && end && t.status !== 'waiting') add('呼び出してから', fmtDur(end - t.calledAt) + (t.status === 'called' ? '（経過中）' : isDone(t) ? '（入室まで）' : '（無効になるまで）'));
  if (isSkipped(t) && t.skippedAt) add('飛ばした時刻', fmtT(t.skippedAt));
  if (t.test) add('種類', 'テスト用');
  return `<table class="det">${rows.join('')}</table>`;
}

/* ---------- 更新（取引） ---------- */
// 他の端末と同時に操作しても二重にならないよう、状態を確認してから書き換える
async function txRun(id, expect, makePatch, text) {
  const ref = db.collection('tickets').doc(id);
  let prev = null;
  try {
    await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      if (!d.exists) throw new Error('gone');
      const cur = d.data(); const s = cur.status === 'arrived' ? 'inroom' : cur.status;
      if (expect && !expect.includes(s)) throw new Error('changed');
      const patch = await makePatch(cur, tx);
      prev = {}; for (const k in patch) prev[k] = cur[k] === undefined ? del() : cur[k];
      tx.update(ref, patch);
    });
    showUndo(text, id, prev);
  } catch (e) {
    alert(e.message === 'changed' ? '他の端末が先に操作しました。画面を最新の状態に更新しました。' : e.message === 'gone' ? 'この整理券が見つかりません。' : '操作できませんでした：' + e.message);
  }
}
let undo = null, undoTimer = null, undoLeft = 0;
function showUndo(text, id, prev) {
  undo = { id, prev }; undoLeft = 5; clearInterval(undoTimer);
  const t = $('toast'); t.hidden = false;
  const draw = () => { t.innerHTML = `<span>${esc(text)}</span><button id="undoBtn">元に戻す (${undoLeft})</button>`; $('undoBtn').onclick = doUndo; };
  draw();
  undoTimer = setInterval(() => { undoLeft--; if (undoLeft <= 0) { clearInterval(undoTimer); t.hidden = true; undo = null; } else draw(); }, 1000);
}
function doUndo() {
  if (!undo) return; const u = undo; undo = null; clearInterval(undoTimer); $('toast').hidden = true;
  db.collection('tickets').doc(u.id).update(u.prev).catch(e => alert('元に戻せませんでした：' + e.message));
}

const act = {
  enter: t => txRun(t.id, ['called'], () => ({ status: 'inroom', enteredAt: Date.now(), torn: del() }), `${t.number}番を入室済みにしました`),
  renotify: t => txRun(t.id, ['called'], () => ({ reNotifiedAt: Date.now() }), `${t.number}番に再通知しました`),
  absent: t => txRun(t.id, ['waiting', 'called'], cur => ({ status: 'absent', absentAt: Date.now(), absentBy: 'staff', absentFrom: cur.skipped ? 'skipped' : cur.status }), `${t.number}番を欠席にしました`),
  // 入室済みにしたのを取り消して、呼び出し中に戻す
  reopen: t => txRun(t.id, ['inroom', 'guided'], () => ({ status: 'called', enteredAt: del(), torn: del() }), `${t.number}番を呼び出し中に戻しました`),
  // 呼び出したまま、順番を後ろにする（飛ばし中）。来たら戻せる
  skip: t => txRun(t.id, ['called'], () => ({ skipped: true, skippedAt: Date.now() }), `${t.number}番を飛ばし中にしました`),
  unskip: t => txRun(t.id, ['called'], () => ({ skipped: del(), skippedAt: del() }), `${t.number}番を呼び出し中に戻しました`)
};
function callNext() {
  const line = list.filter(inLine).sort(byOrder);
  if (!line.length) return;
  const t = line[0];
  txRun(t.id, ['waiting'], () => ({ status: 'called', calledAt: Date.now() }), `${t.number}番を呼び出しました`);
}

/* ---------- 画面 ---------- */
function render() {
  if (holdEl) { pendingRender = true; return; }
  const room = list.filter(inRoom).sort((a, b) => calledAtOf(a) - calledAtOf(b));
  const line = list.filter(inLine).sort(byOrder);
  const skipped = list.filter(isSkipped).sort((a, b) => (a.skippedAt || 0) - (b.skippedAt || 0));
  const done = list.filter(isDone).sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0));
  // 呼び出し中の組の番号（空き枠は出さない）
  $('slots').innerHTML = room.length || skipped.length
    ? room.map(t => `<div class="slot called">${t.number}<small>呼び出し中</small></div>`).join('') + skipped.map(t => `<div class="slot skipped">${t.number}<small>飛ばし中</small></div>`).join('')
    : '';
  $('callNext').disabled = !line.length;
  $('callNext').textContent = line.length ? `次の組を呼ぶ（${line[0].number}番）` : '呼び出せる組はありません';
  const sm = buildSummary(list);
  const nCalled = list.filter(t => t.status === 'called').length, nBad = list.filter(isInvalid).length;
  $('stats').innerHTML = `<div><b>${list.length}</b>発行</div><div><b>${line.length}</b>待ち</div><div><b>${nCalled}</b>呼出中</div><div><b>${done.length}</b>入室済み</div><button id="statBad" class="statbtn"><b>${nBad}</b>無効</button>`;
  $('avgNote').textContent = `平均間隔 ${sm.avgGapSec ? (sm.avgGapSec / 60).toFixed(1) + '分' : '—'}`;
  $('statBad').onclick = () => { hFilter = 'bad'; $('hq').value = ''; $('hist').hidden = false; renderHist(); };
  $('stopNote').innerHTML = cfg.closed ? `<div class="notice stop">発券を停止中${cfg.closedReason ? '：' + esc(cfg.closedReason) : ''}</div>` : '';
  document.body.style.background = cfg.closed ? '#f3e4e4' : '';

  const rowHtml = (t, i) => {
    const since = t.status === 'called' ? t.calledAt : t.createdAt;
    const kind = t.status === 'called' ? 'call' : 'wait';
    const pill = isSkipped(t) ? '飛ばし中' : t.status === 'called' ? '呼び出し中' : (i === 0 ? '次' : '待ち');
    const hold = `<button data-hold="absent" data-id="${t.id}" style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">欠席にする（長押し）</button>`;
    let acts = '';
    if (isSkipped(t)) acts = `<button class="big btn-ok" data-a="enter" data-id="${t.id}">入室済みにする</button><button data-a="unskip" data-id="${t.id}">呼び出し中に戻す</button><button data-a="renotify" data-id="${t.id}">再通知</button>${hold}`;
    else if (t.status === 'called') acts = `<button class="big btn-ok" data-a="enter" data-id="${t.id}">入室済みにする</button><button data-a="renotify" data-id="${t.id}">再通知</button><button data-a="skip" data-id="${t.id}">飛ばす</button>${hold}`;
    else acts = hold;
    return `<div class="row ${isSkipped(t) ? 'skipped' : t.status}" data-since="${since || ''}" data-kind="${kind}" data-late="${t.status === 'called' && !t.skipped ? 1 : 0}">
      <div class="rtop"><button class="numbtn" data-a="check" data-id="${t.id}">${t.number}</button><div class="who">${label(t)}</div><span class="pill ${isSkipped(t) ? 'skipped' : t.status}">${pill}</span><span class="el"></span></div>
      <div class="racts">${acts}</div></div>`;
  };
  const doneHtml = t => `<div class="row inroom"><div class="rtop"><button class="numbtn" data-a="check" data-id="${t.id}">${t.number}</button><div class="who">${label(t)}</div><span class="pill inroom">${t.torn ? '入室済み（もぎり）' : '入室済み'}</span><span class="el" style="font-size:14px">${fmtT(t.enteredAt)}</span></div>
      <div class="racts"><button data-a="reopen" data-id="${t.id}">呼び出し中に戻す</button></div></div>`;
  $('lists').innerHTML = `<h2>呼び出し中（${room.length}組）</h2><div class="grid">${room.map(rowHtml).join('') || '<div class="row" style="color:#8a93a6">呼び出し中の組はありません</div>'}</div>
    <h2>順番待ち（${line.length}組）</h2><div class="grid">${line.map(rowHtml).join('') || '<div class="row" style="color:#8a93a6">順番待ちの組はありません</div>'}</div>
    <h2>飛ばし中（${skipped.length}組）</h2><div class="grid">${skipped.map(rowHtml).join('') || '<div class="row" style="color:#8a93a6">飛ばし中の組はありません</div>'}</div>
    <details style="margin-top:12px"><summary style="font-weight:800;color:#5a6378;padding:8px 4px">入室済み（${done.length}組）</summary><div class="grid">${done.map(doneHtml).join('')}</div></details>`;
  tickEl();
  if (!$('check').hidden) renderCheck();
  if (!$('hist').hidden) renderHist();
  scheduleSummary();
}
function tickEl() {
  document.querySelectorAll('.row[data-since]').forEach(r => {
    const s = +r.dataset.since; const el = r.querySelector('.el');
    if (!s) { el.textContent = ''; return; }
    const sec = Math.max(0, Math.round((Date.now() - s) / 1000));
    el.innerHTML = `<span class="lb">${r.dataset.kind === 'call' ? '呼出' : '待ち'}</span> ${mmss(sec)}`;
    r.classList.toggle('late', r.dataset.late === '1' && sec >= ALERT_MIN * 60);
  });
}
setInterval(tickEl, 1000);
function updateOffline() { $('offline').hidden = !(navigator.onLine === false || (cachedSince && Date.now() - cachedSince > 3000)); }
setInterval(updateOffline, 1000); addEventListener('online', updateOffline); addEventListener('offline', updateOffline);

/* ---------- 集計の書き込み ---------- */
let lastSummary = '', sumTimer = null;
function scheduleSummary() {
  clearTimeout(sumTimer);
  sumTimer = setTimeout(() => {
    const sm = buildSummary(list), js = JSON.stringify(sm);
    if (js === lastSummary) return;
    summaryRef().set({ ...sm, updatedAt: Date.now() }).then(() => { lastSummary = js; }).catch(() => {});
  }, 800);
}

/* ---------- 操作（クリック・長押し） ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const t = list.find(x => x.id === b.dataset.id); if (!t) return;
  if (b.dataset.a === 'check') return openCheck(t.number);
  if (act[b.dataset.a]) act[b.dataset.a](t);
});
function endHold() { if (holdTimer) clearInterval(holdTimer); holdTimer = null; if (holdEl) { holdEl.style.setProperty('--hp', 0); holdEl.classList.remove('hold'); } holdEl = null; if (pendingRender) { pendingRender = false; render(); } }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-hold]'); if (!b) return;
  holdEl = b; b.classList.add('hold'); const start = Date.now();
  holdTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - start) / 700); b.style.setProperty('--hp', p);
    if (p >= 1) { const t = list.find(x => x.id === b.dataset.id); endHold(); if (t) act.absent(t); }
  }, 30);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => { if (holdEl) endHold(); }, true));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
$('callNext').onclick = callNext;

/* ---------- 入口確認 ---------- */
function openCheck(num) { $('check').hidden = false; $('chkIn').value = num || ''; renderCheck(); if (!num) setTimeout(() => $('chkIn').focus(), 50); }
function renderCheck() {
  const v = parseInt($('chkIn').value, 10), box = $('chkRes');
  if (!v) { box.innerHTML = '<p style="color:#5a6378">番号を入力すると、その組の状態が大きく表示されます。</p>'; return; }
  const t = list.find(x => x.number === v);
  if (!t) { box.innerHTML = `<div class="check bad"><div class="n">${v}</div><div class="s">該当する番号がありません</div></div>`; return; }
  const info = `<div style="font-size:20px;font-weight:800;margin-top:6px">${label(t)}</div>`;
  let cls, text, btn = '';
  if (isDone(t)) { cls = 'ok'; text = '入室済み ✔'; }
  else if (t.status === 'called') { cls = 'warn'; text = isSkipped(t) ? '飛ばし中（呼び出したまま、順番を後ろにしています）' : '呼び出し中（まだ入室していません）'; btn = `<button class="full btn-ok" style="min-height:60px;font-size:20px" data-a="enter" data-id="${t.id}">入室済みにする</button>`; }
  else if (t.status === 'waiting') { cls = 'none'; text = 'まだ呼び出していません（順番待ち）'; }
  else { cls = 'bad'; text = t.status === 'cancelled' ? '無効です（キャンセル）' : '無効です（欠席）'; }
  box.innerHTML = `<div class="check ${cls}"><div class="n">${t.number}</div><div class="s">${text}</div>${info}</div>${detailHtml(t)}${btn}`;
}
$('chkIn').oninput = renderCheck; $('chkClose').onclick = () => { $('check').hidden = true; };

/* ---------- 受付した整理券の一覧 ---------- */
let hFilter = 'all';
const H_FILTERS = [['all', 'すべて'], ['live', '待ち・呼び出し中'], ['done', '入室済み'], ['bad', '無効']];
function renderHist() {
  const q = $('hq').value.trim();
  $('hchips').innerHTML = H_FILTERS.map(([k, n]) => `<button data-f="${k}" class="chip ${hFilter === k ? 'on' : ''}">${n}</button>`).join('');
  let ls = list.slice().sort((a, b) => b.number - a.number);
  if (hFilter === 'live') ls = ls.filter(t => t.status === 'waiting' || t.status === 'called');
  if (hFilter === 'done') ls = ls.filter(isDone);
  if (hFilter === 'bad') ls = ls.filter(isInvalid);
  if (q) ls = ls.filter(t => String(t.number) === q.replace(/[^0-9]/g, '') || (t.name || '').includes(q));
  $('hlist').innerHTML = ls.length ? ls.map(t => `<div class="hrow ${t.status}">
      <div class="hn">${t.number}</div>
      <div class="hm"><div class="who">${label(t)} <span class="pill ${isDone(t) ? 'inroom' : t.status}">${stateName(t)}</span></div><div class="ho">${outline(t)}</div></div>
      <button class="ico2" data-a="check" data-id="${t.id}" aria-label="詳しく見る">🔍</button></div>`).join('')
    : '<div class="box" style="color:#8a93a6">該当する整理券はありません</div>';
}
$('histBtn').onclick = () => { $('hist').hidden = false; renderHist(); };
$('hClose').onclick = $('hClose2').onclick = () => { $('hist').hidden = true; };
$('hq').oninput = renderHist;
$('hchips').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { hFilter = b.dataset.f; renderHist(); } };

/* ---------- 管理メニュー ---------- */
$('gearBtn').onclick = () => {
  $('stopBox').innerHTML = cfg.closed
    ? `<div style="font-weight:800">発券を停止しています</div><div style="color:#5a6378">${cfg.closedReason ? '理由：' + esc(cfg.closedReason) : ''}${cfg.reopenAt ? '　再開の予定：' + esc(cfg.reopenAt) : ''}</div><button id="reopenBtn" class="full btn-ok" style="min-height:56px">発券を再開する</button>`
    : `<div style="font-weight:800">発券を一時停止する</div><div style="font-size:14px;color:#5a6378">停止すると、お客さんは整理券を発行できません。会場で列に並んでもらう運用に切り替えてください。すでに整理券を持っている組は、先に呼び出してください。</div>
       <input id="stopReason" type="text" placeholder="停止の理由（例：休憩中）"><input id="reopenAt" type="text" placeholder="再開の予定（例：14:30ごろ）">
       <button id="stopBtn" class="full btn-bad" style="min-height:56px">発券を停止する</button>`;
  if ($('stopBtn')) $('stopBtn').onclick = () => {
    const w = list.filter(isActive).length;
    if (w > 0 && !confirm(`整理券を持っている組が、まだ${w}組います。停止しますか？`)) return;
    counter().set({ closed: true, closedReason: $('stopReason').value.trim(), reopenAt: $('reopenAt').value.trim() }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  };
  if ($('reopenBtn')) $('reopenBtn').onclick = () => counter().set({ closed: false }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  const wOn = cfg.showWait !== false;
  $('waitBox').innerHTML = `<div style="font-weight:800">お客さん画面の待ち時間表示：${wOn ? 'オン' : 'オフ'}</div><div style="font-size:14px;color:#5a6378">オフにすると、「約○分」「○時ごろ」の目安を出さず、「あと○組」だけを表示します。</div><button id="waitBtn" class="full ${wOn ? '' : 'btn-ok'}" style="min-height:52px">${wOn ? '待ち時間を非表示にする' : '待ち時間を表示する'}</button>`;
  $('waitBtn').onclick = () => counter().set({ showWait: !wOn }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  const mOn = cfg.multiTicket !== false;
  $('multiBox').innerHTML = `<div style="font-weight:800">待機中でも新しい整理券を発行できる：${mOn ? 'オン' : 'オフ'}</div><div style="font-size:14px;color:#5a6378">オンの間は、お客さん画面の下に「別の整理券を発行する」が出ます（動作確認用）。本番では、オフにしてください。</div><button id="multiBtn" class="full ${mOn ? '' : 'btn-ok'}" style="min-height:52px">${mOn ? 'オフにする' : 'オンにする'}</button>`;
  $('multiBtn').onclick = () => counter().set({ multiTicket: !mOn }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  $('resetIn').value = ''; $('resetBtn').disabled = true;
  $('menu').hidden = false;
};
$('menuClose').onclick = $('menuClose2').onclick = () => { $('menu').hidden = true; };
$('resetIn').oninput = () => { $('resetBtn').disabled = $('resetIn').value.trim() !== 'リセット'; };
async function deleteTickets(filter) {
  const snap = await db.collection('tickets').where('day', '==', today()).get();
  const docs = snap.docs.filter(d => filter(d.data()));
  for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  return docs.length;
}
$('testDel').onclick = async () => {
  if (!confirm('テスト用の整理券（?test=1 で発行したもの）を削除します。よろしいですか？')) return;
  try {
    const n = await deleteTickets(t => t.test === true);
    const rest = (await db.collection('tickets').where('day', '==', today()).get()).docs.length;
    if (rest === 0) await counter().set({ last: 0 }, { merge: true });
    alert(`${n}件を削除しました${rest === 0 ? '。番号を1番に戻しました。' : '。'}`);
  } catch (e) { alert('削除できませんでした：' + e.message); }
};
$('resetBtn').onclick = async () => {
  if ($('resetIn').value.trim() !== 'リセット') return;
  try { await deleteTickets(() => true); await counter().set({ last: 0 }, { merge: true }); $('menu').hidden = true; alert('リセットしました。'); }
  catch (e) { alert('リセットできませんでした：' + e.message); }
};
$('csvBtn').onclick = () => {
  const st = { waiting: '順番待ち', called: '呼び出し中', inroom: '入室済み', guided: '入室済み', absent: '欠席', cancelled: 'キャンセル' };
  const rows = [['番号', 'ニックネーム', '人数', '状態', '発行時刻', '呼び出し時刻', '入室時刻', '無効の理由', '待った時間（分）', 'テスト']].concat(
    list.map(t => [t.number, t.name || '', t.people, st[t.status] || t.status, fmtT(t.createdAt), fmtT(t.calledAt), fmtT(t.enteredAt), reasonOf(t), t.createdAt && (t.calledAt || endOf(t)) ? Math.round(((t.calledAt || endOf(t)) - t.createdAt) / 60000) : '', t.test ? 'テスト' : '']));
  const text = '\ufeff' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = `seiriken-${today()}.csv`; a.click();
};
$('userBtn').onclick = () => { const u = auth.currentUser || {}; $('acctName').textContent = $('userName').textContent; $('acctMail').textContent = u.email || ''; $('acct').hidden = false; };
$('acctClose').onclick = () => { $('acct').hidden = true; };
$('logoutBtn').onclick = () => { if (confirm('ログアウトします。よろしいですか？')) auth.signOut().then(() => location.reload()); };

/* ---------- ログイン ---------- */
$('loginBtn').onclick = () => auth.signInWithEmailAndPassword($('email').value, $('pass').value).catch(() => alert('ログインできませんでした。メールアドレスとパスワードを確認してください。'));
auth.onAuthStateChanged(u => {
  $('login').hidden = !!u; $('app').hidden = !u;
  if (u) { $('userName').textContent = u.displayName || (u.email || '').split('@')[0] || 'スタッフ'; startWatch(); }
});

function startWatch() {
  if (unsub) unsub(); if (unsubCnt) unsubCnt();
  unsub = watchTickets((l, cached) => { list = l; cachedSince = cached ? (cachedSince || Date.now()) : 0; updateOffline(); render(); });
  unsubCnt = counter().onSnapshot(d => { cfg = d.exists ? d.data() : {}; render(); });
}
// 別のアプリから戻ったときや、通信が復活したときは、つなぎ直して最新の状態を取り直す
document.addEventListener('visibilitychange', () => { if (!document.hidden && auth.currentUser) startWatch(); });
addEventListener('online', () => { if (auth.currentUser) startWatch(); });
</script></body></html>
