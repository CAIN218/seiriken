<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券 スタッフ</title><link rel="stylesheet" href="admin.css?v=34"></head>
<body>
<div id="login" class="login" hidden><div class="box">
  <h3>スタッフ用ログイン</h3>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="loginBtn" class="btn-main full" style="width:100%;min-height:56px">ログイン</button>
</div></div>

<div id="app" hidden>
  <div id="offline" class="offline" hidden>オフラインです（通信が切れています）。操作が反映されない場合があります。</div>
  <div class="topbar"><div class="inner">
    <div class="who-row"><button id="paperBtn" class="paperbtn">スマホなしで発券</button><span class="hico"><button id="histBtn" class="ico">履歴</button><button id="gearBtn" class="ico">設定</button><button id="userBtn" class="usrbtn" aria-label="アカウント"><span id="userName"></span></button></span></div>
    <button id="callNext" class="call btn-main">次の組を呼ぶ</button>
    <div class="stats" id="stats"></div>
    <div id="stopNote"></div>
  </div></div>
  <div class="wrap" id="lists"></div>
  <p style="text-align:center;color:#8a93a6;font-size:13px">v34</p>
</div>

<div id="toast" class="toast" hidden></div>

<div id="hist" class="modal big" hidden><div class="sheet">
  <div class="shead"><h3>履歴</h3><button id="hClose2" class="xbtn">閉じる</button></div>
  <div class="box"><input id="hq" type="text" placeholder="番号またはニックネームで検索" autocomplete="off">
    <div class="chips" id="hchips"></div></div>
  <div id="hlist"></div>
  <button id="hClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="rsheet" class="modal" hidden><div class="sheet">
  <div class="shead"><h3 id="rsTitle"></h3><button id="rsClose" class="xbtn">閉じる</button></div>
  <div id="rsBody"></div>
</div></div>

<div id="psheet" class="modal" hidden><div class="sheet">
  <div class="shead"><h3>スマホなしで発券</h3><button id="pClose" class="xbtn">閉じる</button></div>
  <div id="pBody"></div>
</div></div>

<div id="acct" class="modal" hidden><div class="sheet">
  <h3>ログイン中のアカウント</h3>
  <div class="box"><div style="font-size:20px;font-weight:800" id="acctName"></div><div style="color:#5a6378" id="acctMail"></div></div>
  <button id="logoutBtn" class="full btn-bad" style="min-height:56px">ログアウトする</button>
  <button id="acctClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="check" class="modal" hidden><div class="sheet">
  <h3>この整理券の状態</h3>
  <div class="box"><input id="chkIn" type="hidden">
  <div id="chkRes"></div></div>
  <button id="chkClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<div id="menu" class="modal big" hidden><div class="sheet">
  <div class="shead"><h3>設定</h3><button id="menuClose2" class="xbtn">閉じる</button></div>
  <div class="box" id="stopBox"></div>
  <div class="box" id="waitBox"></div>
  <div class="box" id="multiBox"></div>
  <div class="box" id="pushBox"></div>
  <div class="box"><button id="csvBtn" class="full">今日の記録をCSVでダウンロード</button></div>
  <div class="box"><div style="font-weight:800">テスト用の整理券の削除</div>
    <div style="font-size:14px;color:#5a6378">お客さん画面のURLの末尾に <b>?test=1</b> を付けて発行した整理券だけを削除します。</div>
    <button id="testDel" class="full btn-warn">テスト用の整理券を削除する</button></div>
  <div class="box"><div style="font-weight:800">すべてリセット</div>
    <div style="font-size:14px;color:#5a6378">今日の整理券をすべて削除し、番号を1番に戻します。実行するには「リセット」と入力してください。</div>
    <input id="resetIn" type="text" placeholder="リセット" autocomplete="off">
    <button id="resetBtn" class="full btn-bad" disabled>すべてリセットする</button></div>
  <button id="menuClose" class="full" style="min-height:56px">閉じる</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=34"></script><script src="common.js?v=34"></script>
<script>
const auth = firebase.auth();
const $ = id => document.getElementById(id);
const counter = () => db.collection('counters').doc(today());
const del = () => firebase.firestore.FieldValue.delete();
let list = [], cfg = {}, unsub = null, unsubCnt = null, cachedSince = 0;
let holdEl = null, holdTimer = null, pendingRender = false;
const label = t => `${t.paper ? '<span class="pmark">紙</span> ' : ''}${t.name ? esc(t.name) : '（名前なし）'} <small>${t.people}名</small>`;
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const fmtT = ms => ms ? new Date(ms).toLocaleTimeString('ja-JP', { hour12: false }) : '';

const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + '秒'; const m = Math.floor(s / 60), r = s % 60; return m + '分' + (r ? r + '秒' : ''); };
// その整理券が終わった（または今の）時刻
const endOf = t => isDone(t) ? (t.enteredAt || Date.now()) : t.status === 'absent' ? (t.absentAt || null) : t.status === 'cancelled' ? (t.cancelledAt || null) : Date.now();
const isInvalid = t => t.status === 'absent' || t.status === 'cancelled';
const stateName = t => isDone(t) ? '入室済み' : t.status === 'called' ? '呼び出し中' : t.status === 'waiting' ? '順番待ち' :  t.status === 'cancelled' ? 'キャンセル' : '欠席';
function reasonOf(t) {
  if (t.status === 'cancelled') return t.cancelledBy === 'staff' ? 'スタッフがキャンセルしました' : 'お客さんが自分でキャンセルしました';
  if (t.status === 'absent') return 'スタッフが欠席にしました' + (t.absentFrom === 'called' ? '（呼び出したが来なかった）' : t.absentFrom === 'waiting' ? '（順番待ちのとき）' : t.absentFrom === 'skipped' ? '（呼び出したが来なかった）' : '');
  return '';
}
// 一覧に出す短い説明
function outline(t) {
  const end = endOf(t), made = t.createdAt;
  if (isDone(t)) return `${fmtT(t.enteredAt)}に入室` + (made && t.calledAt ? `　呼ばれるまで${fmtDur(t.calledAt - made)}` : '');
  if (t.status === 'called') return `${fmtT(t.calledAt)}に呼び出し`;
  if (t.status === 'waiting') return made ? `${fmtT(made)}に発行　待機中${fmtDur(Date.now() - made)}` : '';
  return `${t.status === 'cancelled' ? 'お客さんがキャンセル' : 'スタッフが欠席にした'}` + (made && end ? `　待ち${fmtDur(end - made)}` : '');
}
// 詳しい経過
function detailHtml(t) {
  const rows = [], end = endOf(t), made = t.createdAt;
  const add = (k, v) => rows.push(`<tr><th>${k}</th><td>${v}</td></tr>`);
  if (isInvalid(t)) add('無効になった理由', `<b style="color:var(--bad)">${reasonOf(t)}</b>`);
  if (made) add('発行', fmtT(made));
  if (t.calledAt) add('呼び出し', fmtT(t.calledAt));
  if (isDone(t)) add('入室', fmtT(t.enteredAt) + (t.torn ? '（お客さんがもぎった）' : '（スタッフが操作）'));
  if (t.status === 'absent') add('欠席にした時刻', t.absentAt ? fmtT(t.absentAt) : '記録なし');
  if (t.status === 'cancelled') add('キャンセルした時刻', t.cancelledAt ? fmtT(t.cancelledAt) : '記録なし');
  if (made && (t.calledAt || end)) add('待った時間', fmtDur((t.calledAt || end) - made) + (t.calledAt ? '（発行→呼び出し）' : isInvalid(t) ? '（発行→無効になるまで）' : '（発行から今まで）'));
  if (t.calledAt && end && t.status !== 'waiting') add('呼び出してから', fmtDur(end - t.calledAt) + (t.status === 'called' ? '（経過中）' : isDone(t) ? '（入室まで）' : '（無効になるまで）'));
  if (t.test) add('種類', 'テスト用');
  if (t.paper) add('種類', '紙の整理券（スマホなし）');
  return `<table class="det">${rows.join('')}</table>`;
}

/* ---------- 更新（取引） ---------- */
// 他の端末と同時に操作しても二重にならないよう、状態を確認してから書き換える
async function txRun(id, expect, makePatch, text) {
  const ref = db.collection('tickets').doc(id);
  let prev = null;
  try {
    await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      if (!d.exists) throw new Error('gone');
      const cur = d.data(); const s = cur.status === 'arrived' ? 'inroom' : cur.status;
      if (expect && !expect.includes(s)) throw new Error('changed');
      const patch = await makePatch(cur, tx);
      prev = {}; for (const k in patch) prev[k] = cur[k] === undefined ? del() : cur[k];
      tx.update(ref, patch);
    });
    showUndo(text, id, prev);
    return true;
  } catch (e) {
    alert(e.message === 'changed' ? '他の端末が先に操作しました。画面を最新の状態に更新しました。' : e.message === 'gone' ? 'この整理券が見つかりません。' : '操作できませんでした：' + e.message);
    return false;
  }
}
let undo = null, undoTimer = null, undoLeft = 0;
function showUndo(text, id, prev) {
  undo = { id, prev }; undoLeft = 5; clearInterval(undoTimer);
  const t = $('toast'); t.hidden = false;
  const draw = () => { t.innerHTML = `<span>${esc(text)}</span><button id="undoBtn">元に戻す (${undoLeft})</button>`; $('undoBtn').onclick = doUndo; };
  draw();
  undoTimer = setInterval(() => { undoLeft--; if (undoLeft <= 0) { clearInterval(undoTimer); t.hidden = true; undo = null; } else draw(); }, 1000);
}
function doUndo() {
  if (!undo) return; const u = undo; undo = null; clearInterval(undoTimer); $('toast').hidden = true;
  db.collection('tickets').doc(u.id).update(u.prev).catch(e => alert('元に戻せませんでした：' + e.message));
}

// 画面を閉じているお客さんにも届く通知（設定済みのときだけ）
const PUSH_URL = (window.PUSH_WORKER_URL || '').replace(/\/$/, '');
function pushNotify(id) {
  if (!PUSH_URL) return;
  fetch(PUSH_URL + '/notify', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ ticketId: id }) }).catch(() => {});
}
// 「まもなく順番です」の位置に入った組へ、一度だけ通知する
function pushSoon() {
  if (!PUSH_URL) return;
  list.filter(inLine).sort(byOrder).slice(0, SOON_AHEAD + 1).forEach(t => {
    if (!t.soonPushedAt) db.collection('tickets').doc(t.id).update({ soonPushedAt: Date.now() }).then(() => pushNotify(t.id)).catch(() => {});
  });
}

// 「後ろへ回す」の位置：今の順番待ちの3組目と4組目の間（3組に満たなければ最後尾）
function backKey(selfId) {
  const ls = list.filter(inLine).sort(byOrder).filter(t => t.id !== selfId);
  if (ls.length >= 4) return (orderKey(ls[2]) + orderKey(ls[3])) / 2;
  return ls.length ? orderKey(ls[ls.length - 1]) + 1 : null;
}
const act = {
  enter: t => txRun(t.id, ['called'], () => ({ status: 'inroom', enteredAt: Date.now(), torn: del() }), `${t.number}番を入室済みにしました`),
  renotify: t => txRun(t.id, ['called'], () => ({ reNotifiedAt: Date.now() }), `${t.number}番に再通知しました`).then(ok => { if (ok) pushNotify(t.id); }),
  absent: t => txRun(t.id, ['waiting', 'called'], cur => ({ status: 'absent', absentAt: Date.now(), absentBy: 'staff', absentFrom: cur.status }), `${t.number}番を欠席にしました`),
  // 入室済みにしたのを取り消して、呼び出し中に戻す
  reopen: t => txRun(t.id, ['inroom', 'guided'], () => ({ status: 'called', enteredAt: del(), torn: del() }), `${t.number}番を呼び出し中に戻しました`),
  // 順番を指定して呼ぶ
  call: t => txRun(t.id, ['waiting'], () => ({ status: 'called', calledAt: Date.now() }), `${t.number}番を呼び出しました`).then(ok => { if (ok && !t.paper) pushNotify(t.id); return ok; }),
  // 欠席にした券を、呼び出し中に戻す（お客さんの画面は「待機室へお越しください」に戻る）
  restore: t => txRun(t.id, ['absent'], () => ({ status: 'called', calledAt: Date.now(), absentAt: del(), absentBy: del(), absentFrom: del() }), `${t.number}番を呼び出し中に戻しました`).then(ok => { if (ok) pushNotify(t.id); return ok; }),
  // 順番待ちの組を、順番待ちのまま後ろへ回す（旧：来ない組も戻せた）
  // 来ない組：順番待ちに戻して、少し後ろに回す
  back: t => txRun(t.id, ['called', 'waiting'], () => {
    const k = backKey(t.id), patch = { status: 'waiting', calledAt: del(), reNotifiedAt: del(), soonPushedAt: del(), skipped: del(), skippedAt: del() };
    if (k != null) patch.orderKey = k;
    return patch;
  }, `${t.number}番を後ろへ回しました`),
  first: t => txRun(t.id, ['waiting'], () => {
    const ls = list.filter(inLine).sort(byOrder).filter(x => x.id !== t.id);
    return ls.length ? { orderKey: orderKey(ls[0]) - 1 } : {};
  }, `${t.number}番を先頭にしました`)
};
function callNext() {
  const line = list.filter(inLine).sort(byOrder);
  if (!line.length) return;
  const t = line[0];
  txRun(t.id, ['waiting'], () => ({ status: 'called', calledAt: Date.now() }), `${t.number}番を呼び出しました`).then(ok => { if (ok && !t.paper) pushNotify(t.id); });
}

/* ---------- 画面 ---------- */
function render() {
  if (holdEl || drag) { pendingRender = true; return; }
  const room = list.filter(inRoom).sort((a, b) => calledAtOf(a) - calledAtOf(b));
  const line = list.filter(inLine).sort(byOrder);
  const done = list.filter(isDone).sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0));
  $('callNext').disabled = !line.length;
  $('callNext').textContent = line.length ? `次の組を呼ぶ（${line[0].number}番）` : '呼び出せる組はありません';
  const nBad = list.filter(isInvalid).length;
  $('stats').innerHTML = `<span>待ち <b>${line.length}</b></span><span>呼出中 <b>${room.length}</b></span><span>入室済み <b>${done.length}</b></span><button id="statBad" class="statlink">無効 <b>${nBad}</b></button>`;
  $('statBad').onclick = () => { hFilter = 'bad'; $('hq').value = ''; $('hist').hidden = false; renderHist(); };
  $('stopNote').innerHTML = cfg.closed ? `<div class="notice stop">発券を停止中${cfg.closedReason ? '：' + esc(cfg.closedReason) : ''}</div>` : '';
  document.body.style.background = cfg.closed ? '#f3e4e4' : '';

  const rowHtml = (t, i) => {
    const called = t.status === 'called';
    const pill = called ? '呼び出し中' : (i === 0 ? '次の順番' : '順番待ち');
    const right = called ? (t.paper ? `<button class="mini ok" data-a="enter" data-id="${t.id}">入室済みにする</button>` : `<button class="mini" data-a="renotify" data-id="${t.id}">再通知</button>`) : `<span class="dh" data-drag="${t.id}" aria-label="長押ししてドラッグで並べ替え">≡</span>`;
    return `<div class="row ${t.status}" data-id="${t.id}" data-since="${(called ? t.calledAt : t.createdAt) || ''}" data-kind="${called ? 'call' : 'wait'}" data-late="${called ? 1 : 0}">
      <div class="rtop"><div class="num">${t.number}</div><div class="rmid"><div class="who">${label(t)}</div><div class="rsub"><span class="pill ${t.status}">${pill}</span><span class="el"></span>${called ? '<span class="ask">欠席にしますか？</span>' : ''}</div></div>${right}</div></div>`;
  };
  const doneHtml = t => `<div class="row inroom" data-id="${t.id}"><div class="rtop"><div class="num">${t.number}</div><div class="rmid"><div class="who">${label(t)}</div><div class="rsub"><span class="pill inroom">${t.torn ? '入室済み（もぎり）' : '入室済み'}</span><span class="el" style="font-size:14px">${fmtT(t.enteredAt)}</span></div></div></div></div>`;
  $('lists').innerHTML = `<div class="grid">
    ${room.length ? `<h2>呼び出し中（${room.length}組）</h2>${room.map(rowHtml).join('')}` : ''}
    ${line.length ? `<h2>順番待ち（${line.length}組）</h2>${line.map(rowHtml).join('')}` : ''}
    ${!room.length && !line.length ? '<div class="row" style="color:#8a93a6">呼び出し中・順番待ちの組はありません</div>' : ''}</div>
    <details style="margin-top:12px"><summary style="font-weight:800;color:#5a6378;padding:8px 4px">入室済み（${done.length}組）</summary><div class="grid">${done.map(doneHtml).join('')}</div></details>`;
  tickEl();
  if (!$('check').hidden) renderCheck();
  if (!$('hist').hidden) renderHist();
  if (!$('rsheet').hidden) renderSheet();
  scheduleSummary();
}
function tickEl() {
  document.querySelectorAll('.row[data-since]').forEach(r => {
    const s = +r.dataset.since; const el = r.querySelector('.el');
    if (!s) { el.textContent = ''; return; }
    const sec = Math.max(0, Math.round((Date.now() - s) / 1000));
    el.innerHTML = `<span class="lb">${r.dataset.kind === 'call' ? '呼出' : '待ち'}</span> ${mmss(sec)}`;
    r.classList.toggle('late', r.dataset.late === '1' && sec >= ALERT_MIN * 60);
    r.classList.toggle('over', r.dataset.late === '1' && sec >= 15 * 60);
  });
}
setInterval(tickEl, 1000);
function updateOffline() { $('offline').hidden = !(navigator.onLine === false || (cachedSince && Date.now() - cachedSince > 3000)); }
setInterval(updateOffline, 1000); addEventListener('online', updateOffline); addEventListener('offline', updateOffline);

/* ---------- 集計の書き込み ---------- */
let lastSummary = '', sumTimer = null;
function scheduleSummary() {
  clearTimeout(sumTimer); pushSoon();
  sumTimer = setTimeout(() => {
    const sm = buildSummary(list), js = JSON.stringify(sm);
    if (js === lastSummary) return;
    summaryRef().set({ ...sm, updatedAt: Date.now() }).then(() => { lastSummary = js; }).catch(() => {});
  }, 800);
}

// モニターが「止まっていない」と分かるよう、内容が変わらなくても1分ごとに更新時刻だけ書き直す
setInterval(() => { if (auth.currentUser && lastSummary) summaryRef().set({ ...buildSummary(list), updatedAt: Date.now() }).catch(() => {}); }, 60000);

/* ---------- 操作（クリック・長押し） ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'rsheet') { closeSheet(); return; }
  const b = e.target.closest('button[data-a]');
  if (b) {
    const t = list.find(x => x.id === b.dataset.id); if (!t) return;
    if (b.dataset.a === 'check') return openCheck(t.number);
    if (act[b.dataset.a]) { act[b.dataset.a](t); if (b.closest('#rsheet')) closeSheet(); }
    return;
  }
  const row = e.target.closest('.row[data-id]');
  if (row && !e.target.closest('.dh') && Date.now() - dragEndedAt > 400) openSheet(row.dataset.id);
});
function endHold() { if (holdTimer) clearInterval(holdTimer); holdTimer = null; if (holdEl) { holdEl.style.setProperty('--hp', 0); holdEl.classList.remove('hold'); } holdEl = null; if (pendingRender) { pendingRender = false; render(); } }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-hold]'); if (!b) return;
  holdEl = b; b.classList.add('hold'); const start = Date.now();
  holdTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - start) / 700); b.style.setProperty('--hp', p);
    if (p >= 1) { const t = list.find(x => x.id === b.dataset.id); endHold(); if (t) { act.absent(t); closeSheet(); } }
  }, 30);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => { if (holdEl) endHold(); }, true));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
$('callNext').onclick = callNext;

/* ---------- 入口確認 ---------- */
function openCheck(num) { $('check').hidden = false; $('chkIn').value = num || ''; renderCheck(); if (!num) setTimeout(() => $('chkIn').focus(), 50); }
function renderCheck() {
  const v = parseInt($('chkIn').value, 10), box = $('chkRes');
  if (!v) { box.innerHTML = '<p style="color:#5a6378">番号を入力すると、その組の状態が大きく表示されます。</p>'; return; }
  const t = list.find(x => x.number === v);
  if (!t) { box.innerHTML = `<div class="check bad"><div class="n">${v}</div><div class="s">該当する番号がありません</div></div>`; return; }
  const info = `<div style="font-size:20px;font-weight:800;margin-top:6px">${label(t)}</div>`;
  let cls, text, btn = '';
  if (isDone(t)) { cls = 'ok'; text = '入室済み'; }
  else if (t.status === 'called') { cls = 'warn'; text = '呼び出し中（まだ入室していません）'; btn = `<button class="full btn-ok" style="min-height:60px;font-size:20px" data-a="enter" data-id="${t.id}">入室済みにする</button>`; }
  else if (t.status === 'waiting') { cls = 'none'; text = 'まだ呼び出していません（順番待ち）'; }
  else { cls = 'bad'; text = t.status === 'cancelled' ? '無効です（キャンセル）' : '無効です（欠席）'; if (t.status === 'absent') btn = `<button class="full btn-ok" style="min-height:60px;font-size:20px" data-a="restore" data-id="${t.id}">呼び出し中に戻す</button>`; }
  box.innerHTML = `<div class="check ${cls}"><div class="n">${t.number}</div><div class="s">${text}</div>${info}</div>${detailHtml(t)}${btn}`;
}

/* ---------- 整理券の履歴 ---------- */

/* ---------- 行をタップして開く操作シート ---------- */
let sheetId = null;

/* ---------- 順番待ちの並べ替え（≡ を長押ししてドラッグ） ---------- */
let drag = null, dragEndedAt = 0;
document.addEventListener('contextmenu', e => { if (e.target.closest('.dh')) e.preventDefault(); });
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.dh'); if (!h || drag) return;
  const row = h.closest('.row');
  drag = { id: h.dataset.drag, row, h, pid: e.pointerId, sx: e.clientX, sy: e.clientY, y: e.clientY, active: false, sc0: window.scrollY };
  try { h.setPointerCapture(e.pointerId); } catch (er) {}
  drag.timer = setTimeout(beginDrag, 200);
});
function beginDrag() {
  const d = drag; if (!d) return;
  d.active = true;
  d.rows = [...document.querySelectorAll('#lists .row.waiting')];
  d.i0 = d.rows.indexOf(d.row);
  d.rects = d.rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + window.scrollY, h: b.height }; });
  d.H = d.rects[d.i0].h + 8; d.to = d.i0;
  d.rows.forEach(r => { if (r !== d.row) r.classList.add('shift'); });
  d.row.classList.add('lift');
  try { navigator.vibrate && navigator.vibrate(15); } catch (er) {}
  scrollLoop();
}
function updateDrag() {
  const d = drag; if (!d || !d.active) return;
  const dy = d.y - d.sy + (window.scrollY - d.sc0);
  d.row.style.transform = `translateY(${dy}px)`;
  const c = d.rects[d.i0].top + d.rects[d.i0].h / 2 + dy;
  const others = d.rows.map((r, i) => i).filter(i => i !== d.i0);
  d.to = others.filter(i => d.rects[i].top + d.rects[i].h / 2 < c).length;
  d.rows.forEach((r, i) => {
    if (i === d.i0) return;
    let sh = 0;
    if (d.to > d.i0 && i > d.i0 && i <= d.to) sh = -d.H;
    else if (d.to < d.i0 && i >= d.to && i < d.i0) sh = d.H;
    r.style.transform = sh ? `translateY(${sh}px)` : '';
  });
}
function scrollLoop() {
  const d = drag; if (!d || !d.active) return;
  const top = document.querySelector('.topbar').getBoundingClientRect().bottom + 50, bot = innerHeight - 60;
  if (d.y < top) scrollBy(0, -14); else if (d.y > bot) scrollBy(0, 14);
  updateDrag();
  requestAnimationFrame(scrollLoop);
}
document.addEventListener('pointermove', e => {
  const d = drag; if (!d || e.pointerId !== d.pid) return;
  d.y = e.clientY;
  if (!d.active) { if (Math.abs(e.clientX - d.sx) > 6 || Math.abs(e.clientY - d.sy) > 6) { clearTimeout(d.timer); beginDrag(); } else return; }
  e.preventDefault(); updateDrag();
}, { passive: false });
async function endDrag(e, cancelled) {
  const d = drag; if (!d || e.pointerId !== d.pid) return;
  clearTimeout(d.timer);
  if (!d.active) { drag = null; return; }
  d.active = false; dragEndedAt = Date.now();
  const flush = () => { drag = null; setTimeout(() => { pendingRender = false; render(); }, 250); };
  d.rows.forEach(r => { r.classList.remove('shift', 'lift'); r.style.transform = ''; });
  if (cancelled || d.to === d.i0) { drag = null; if (pendingRender) { pendingRender = false; render(); } return; }
  // 指を離した位置に、その場で並べ替えてから、前後の中間値を1件だけ書き込む
  const cont = d.row.parentNode, others = d.rows.filter(r => r !== d.row);
  const before = others[d.to] || null;
  cont.insertBefore(d.row, before || (others[others.length - 1].nextSibling));
  const valid = id => { const t = list.find(x => x.id === id); return t && inLine(t) ? t : null; };
  let prev = null, next = null;
  for (let i = d.to - 1; i >= 0 && !prev; i--) prev = valid(others[i].dataset.id);
  for (let i = d.to; i < others.length && !next; i++) next = valid(others[i].dataset.id);
  const k = prev && next ? (orderKey(prev) + orderKey(next)) / 2 : !prev && next ? orderKey(next) - 1 : prev ? orderKey(prev) + 1 : null;
  const t = list.find(x => x.id === d.id);
  if (k == null || !t) { flush(); return; }
  await txRun(d.id, ['waiting'], () => ({ orderKey: k }), `${t.number}番の順番を変えました`);
  flush();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------- スマホなしの方の発券（紙） ---------- */
const pf = { name: '', people: 1, err: '', busy: false, result: null };
const fmtEta = d => `${d.getHours()}時${String(d.getMinutes()).padStart(2, '0')}分ごろ`;
function renderPaper() {
  if (pf.result) {
    const r = pf.result;
    $('pBody').innerHTML = `<div class="box c" style="text-align:center"><div style="font-weight:800;color:#5a6378">整理券の番号</div><div class="pnum">${r.n}</div>
      <div class="peta">目安 ${fmtEta(r.eta)}</div><div style="color:#5a6378;margin-top:6px">${esc(r.name)} さん　${r.people}名</div></div>
      <div class="ho" style="margin:0 4px 8px">番号と目安の時刻を、カードに書き写してお渡しください。</div>
      <button id="pNext" class="full btn-main" style="min-height:60px;font-size:20px">続けて発券する</button>`;
    $('pNext').onclick = () => { pf.result = null; pf.name = ''; pf.people = 1; renderPaper(); setTimeout(() => $('pName') && $('pName').focus(), 50); };
    return;
  }
  $('pBody').innerHTML = `<div class="box"><div style="font-weight:800">ニックネーム（12文字まで）</div>
      <input id="pName" type="text" maxlength="12" placeholder="例：たろう" value="${esc(pf.name)}" autocomplete="off">
      <div style="font-weight:800;margin-top:8px">人数</div>
      <div class="pseg"><button data-pp="1" class="${pf.people === 1 ? 'on' : ''}">1人</button><button data-pp="2" class="${pf.people === 2 ? 'on' : ''}">2人</button></div>
      ${pf.err ? `<div style="color:var(--bad);font-weight:800;margin-top:8px">${esc(pf.err)}</div>` : ''}</div>
    <button id="pIssue" class="full btn-main" style="min-height:64px;font-size:22px" ${pf.busy ? 'disabled' : ''}>${pf.busy ? '発券しています…' : '発券する'}</button>`;
  $('pName').oninput = e => { pf.name = e.target.value; };
  document.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { pf.people = +b.dataset.pp; renderPaper(); });
  $('pIssue').onclick = issuePaper;
}
async function issuePaper() {
  const name = pf.name.trim().slice(0, 12);
  if (!name) { pf.err = 'ニックネームを入力してください'; renderPaper(); return; }
  if (pf.busy) return; pf.busy = true; pf.err = ''; renderPaper();
  const ref = counter(), newRef = db.collection('tickets').doc();
  const ahead = list.filter(inLine).length, gap = buildSummary(list).avgGapSec || DEFAULT_GAP_SEC, people = pf.people;
  let n = 0;
  try {
    await db.runTransaction(async tx => {
      const c = await tx.get(ref);
      if (c.exists && c.data().closed) throw new Error('closed');
      n = (c.exists ? c.data().last || 0 : 0) + 1;
      tx.set(ref, { last: n }, { merge: true });
      tx.set(newRef, { day: today(), number: n, name, people, status: 'waiting', createdAt: Date.now(), paper: true });
    });
    pf.result = { n, name, people, eta: new Date(Math.round((Date.now() + (ahead + 1) * gap * 1000) / 300000) * 300000) };
  } catch (e) {
    pf.err = e.message === 'closed' ? '発券を停止中です。設定から再開してください' : '発券できませんでした。もう一度お試しください';
  }
  pf.busy = false; renderPaper();
}
$('paperBtn').onclick = () => { pf.result = null; pf.err = ''; $('psheet').hidden = false; renderPaper(); };
$('pClose').onclick = () => { $('psheet').hidden = true; };

/* ---------- 管理メニュー ---------- */
$('gearBtn').onclick = () => {
  $('stopBox').innerHTML = cfg.closed
    ? `<div style="font-weight:800">発券を停止しています</div><div style="color:#5a6378">${cfg.closedReason ? '理由：' + esc(cfg.closedReason) : ''}${cfg.reopenAt ? '　再開の予定：' + esc(cfg.reopenAt) : ''}</div><button id="reopenBtn" class="full btn-ok" style="min-height:56px">発券を再開する</button>`
    : `<div style="font-weight:800">発券を一時停止する</div><div style="font-size:14px;color:#5a6378">停止すると、お客さんは整理券を発行できません。会場で列に並んでもらう運用に切り替えてください。すでに整理券を持っている組は、先に呼び出してください。</div>
       <input id="stopReason" type="text" placeholder="停止の理由（例：休憩中）"><input id="reopenAt" type="text" placeholder="再開の予定（例：14:30ごろ）">
       <button id="stopBtn" class="full btn-bad" style="min-height:56px">発券を停止する</button>`;
  if ($('stopBtn')) $('stopBtn').onclick = () => {
    const w = list.filter(isActive).length;
    if (w > 0 && !confirm(`整理券を持っている組が、まだ${w}組います。停止しますか？`)) return;
    counter().set({ closed: true, closedReason: $('stopReason').value.trim(), reopenAt: $('reopenAt').value.trim() }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  };
  if ($('reopenBtn')) $('reopenBtn').onclick = () => counter().set({ closed: false }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  const wOn = cfg.showWait !== false;
  $('waitBox').innerHTML = `<div style="font-weight:800">お客さん画面の待ち時間表示：${wOn ? 'オン' : 'オフ'}</div><div style="font-size:14px;color:#5a6378">オフにすると、「約○分」「○時ごろ」の目安を出さず、「あと○組」だけを表示します。</div><button id="waitBtn" class="full ${wOn ? '' : 'btn-ok'}" style="min-height:52px">${wOn ? '待ち時間を非表示にする' : '待ち時間を表示する'}</button>`;
  $('waitBtn').onclick = () => counter().set({ showWait: !wOn }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  $('pushBox').innerHTML = PUSH_URL
    ? `<div style="font-weight:800">画面を閉じていても届く通知</div><div style="font-size:14px;color:#5a6378">通知サーバーにつながるかを確認します。</div><button id="pushChk" class="full" style="min-height:52px">通知サーバーを確認する</button>`
    : `<div style="font-weight:800">画面を閉じていても届く通知：未設定</div><div style="font-size:14px;color:#5a6378">push-worker/SETUP.md の手順で設定すると使えます。</div>`;
  if ($('pushChk')) $('pushChk').onclick = async () => { try { const r = await fetch(PUSH_URL + '/vapid'); const t = await r.text(); alert(r.ok && t.length > 60 ? '通知サーバーにつながりました。' : '通知サーバーから、想定外の返事がありました：' + t.slice(0, 120)); } catch (e) { alert('通知サーバーにつながりませんでした。URLを確認してください。'); } };
  const mOn = cfg.multiTicket !== false;
  $('multiBox').innerHTML = `<div style="font-weight:800">待機中でも新しい整理券を発行できる：${mOn ? 'オン' : 'オフ'}</div><div style="font-size:14px;color:#5a6378">オンの間は、お客さん画面の下に「別の整理券を発行する」が出ます（動作確認用）。本番では、オフにしてください。</div><button id="multiBtn" class="full ${mOn ? '' : 'btn-ok'}" style="min-height:52px">${mOn ? 'オフにする' : 'オンにする'}</button>`;
  $('multiBtn').onclick = () => counter().set({ multiTicket: !mOn }, { merge: true }).then(() => { $('menu').hidden = true; }).catch(e => alert('変更できませんでした：' + e.message));
  $('resetIn').value = ''; $('resetBtn').disabled = true;
  $('menu').hidden = false;
};
$('menuClose').onclick = $('menuClose2').onclick = () => { $('menu').hidden = true; };
$('resetIn').oninput = () => { $('resetBtn').disabled = $('resetIn').value.trim() !== 'リセット'; };
async function deleteTickets(filter) {
  const snap = await db.collection('tickets').where('day', '==', today()).get();
  const docs = snap.docs.filter(d => filter(d.data()));
  const ids = new Set(docs.map(d => d.id));
  const subs = (await db.collection('pushSubs').where('day', '==', today()).get().catch(() => ({ docs: [] }))).docs.filter(d => ids.has(d.id));
  for (let i = 0; i < subs.length; i += 400) { const b = db.batch(); subs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  return docs.length;
}
$('testDel').onclick = async () => {
  if (!confirm('テスト用の整理券（?test=1 で発行したもの）を削除します。よろしいですか？')) return;
  try {
    const n = await deleteTickets(t => t.test === true);
    const rest = (await db.collection('tickets').where('day', '==', today()).get()).docs.length;
    if (rest === 0) await counter().set({ last: 0 }, { merge: true });
    alert(`${n}件を削除しました${rest === 0 ? '。番号を1番に戻しました。' : '。'}`);
  } catch (e) { alert('削除できませんでした：' + e.message); }
};
$('resetBtn').onclick = async () => {
  if ($('resetIn').value.trim() !== 'リセット') return;
  try { await deleteTickets(() => true); await counter().set({ last: 0 }, { merge: true }); $('menu').hidden = true; alert('リセットしました。'); }
  catch (e) { alert('リセットできませんでした：' + e.message); }
};
$('csvBtn').onclick = () => {
  const st = { waiting: '順番待ち', called: '呼び出し中', inroom: '入室済み', guided: '入室済み', absent: '欠席', cancelled: 'キャンセル' };
  const rows = [['番号', 'ニックネーム', '人数', '状態', '発行時刻', '呼び出し時刻', '入室時刻', '無効の理由', '待った時間（分）', 'テスト', '紙']].concat(
    list.map(t => [t.number, t.name || '', t.people, st[t.status] || t.status, fmtT(t.createdAt), fmtT(t.calledAt), fmtT(t.enteredAt), reasonOf(t), t.createdAt && (t.calledAt || endOf(t)) ? Math.round(((t.calledAt || endOf(t)) - t.createdAt) / 60000) : '', t.test ? 'テスト' : '', t.paper ? '紙' : '']));
  const text = '\ufeff' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = `seiriken-${today()}.csv`; a.click();
};
$('userBtn').onclick = () => { const u = auth.currentUser || {}; $('acctName').textContent = $('userName').textContent; $('acctMail').textContent = u.email || ''; $('acct').hidden = false; };
$('acctClose').onclick = () => { $('acct').hidden = true; };

/* ---------- ログイン ---------- */
$('loginBtn').onclick = () => auth.signInWithEmailAndPassword($('email').value, $('pass').value).catch(() => alert('ログインできませんでした。メールアドレスとパスワードを確認してください。'));
auth.onAuthStateChanged(u => {

function startWatch() {

  unsubCnt = counter().onSnapshot(d => { cfg = d.exists ? d.data() : {}; render(); });
}
// 別のアプリから戻ったときや、通信が復活したときは、つなぎ直して最新の状態を取り直す
document.addEventListener('visibilitychange', () => { if (!document.hidden && auth.currentUser) startWatch(); });
addEventListener('online', () => { if (auth.currentUser) startWatch(); });
