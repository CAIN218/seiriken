<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3a7d6e"><link rel="stylesheet" href="customer.css?v=29"></head>
<body class="st-none"><div id="app"><div class="scr"><p class="c small">読み込み中…</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=29"></script><script src="push-store.js?v=29"></script><script src="common.js?v=29"></script>
<script>
const KEY = 'seiriken-' + today();
const TEST = /[?&]test=1/.test(location.search);
let myId = null, people = 1, nick = '', formErr = '', busy = false;
let me = null, sum = {}, cfg = {}, st = {}, unsubMe = null, dragging = false, pending = false;
try { myId = localStorage.getItem(KEY) || new URLSearchParams(location.search).get('t'); nick = localStorage.getItem('seiriken-nick') || ''; } catch (e) {}
const app = document.getElementById('app');
const line = () => sum.line || [];
const showWait = () => cfg.showWait !== false;
const gapSec = () => sum.avgGapSec || DEFAULT_GAP_SEC;
const fmtHM = d => d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
const fmtHMS = ms => new Date(ms).toLocaleTimeString('ja-JP', { hour12: false });
// 戻ってきてほしい時刻（5分単位の目安）
function etaText(ahead) { const t = Date.now() + (ahead + 1) * gapSec() * 1000; return fmtHM(new Date(Math.round(t / 300000) * 300000)); }

/* ---------- 音・振動 ---------- */
let actx = null, ringTimer = null, ringSilenced = false;
const audioOn = () => !!actx && actx.state === 'running';
// 音が実際に鳴る状態かどうかで、通知ボタンの表示を切り替える
function updNotif() {
  const b = document.getElementById('notif'); if (!b) return;
  b.textContent = audioOn() ? '🔔 通知オン（タップで音を確認）' : '🔕 タップして音をオンにする';
  b.className = audioOn() ? 'btn sub' : 'btn';
}
function ensureAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.addEventListener('statechange', updNotif); }
    if (actx.state !== 'running') return actx.resume().then(updNotif, () => {});
  } catch (e) {}
  return Promise.resolve();
}
document.addEventListener('pointerdown', ensureAudio, { passive: true });
function beep(n) {
  if (!actx) return;
  for (let i = 0; i < n; i++) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination); o.frequency.value = i % 2 ? 660 : 880; g.gain.value = 0.3;
    const t = actx.currentTime + i * 0.28; o.start(t); o.stop(t + 0.2);
  }
}
function rip() {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * 0.4), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5) * (0.55 + 0.45 * Math.sin(i / 40));
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.7; g.gain.value = 0.9;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
function note(title, body) { try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) {} }
function ring() { if (ringSilenced) return; beep(3); vibrate([400, 150, 400, 150, 400]); }
function startRing() { stopRing(); ringSilenced = false; ring(); ringTimer = setInterval(ring, 3000); }
function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }
// 呼び出し中は、画面のどこをタップしても音が止まる
document.addEventListener('pointerdown', () => { if (ringTimer) ringSilenced = true; }, { passive: true });

/* ---------- 画面を閉じていても届く通知（Web Push） ---------- */
const PUSH_URL = (window.PUSH_WORKER_URL || '').replace(/\/$/, '');
const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let pushState = 'unknown', lastSynced = null;
const b64uBytes = str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(str.length / 4) * 4, '=')), c => c.charCodeAt(0));
async function refreshPushState() {
  if (!PUSH_URL) pushState = 'hidden';
  else if (isIOS && !isStandalone) pushState = 'needInstall';
  else if (!pushOk) pushState = 'hidden';
  else if (Notification.permission === 'denied') pushState = 'denied';
  else {
    try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); pushState = sub && Notification.permission === 'granted' ? 'on' : 'off'; if (sub) syncPush(sub); }
    catch (e) { pushState = 'off'; }
  }
  render();
}
// 今の整理券と、この端末の通知の宛先を結びつける
async function syncPush(sub) {
  if (!myId || !sub || lastSynced === myId) return;
  lastSynced = myId;
  try { await idbSet('ticketId', myId); await db.collection('pushSubs').doc(myId).set({ endpoint: sub.endpoint, day: today(), createdAt: Date.now() }); }
  catch (e) { lastSynced = null; }
}
async function enablePush() {
  try {
    ensureAudio();
    if ((await Notification.requestPermission()) !== 'granted') return refreshPushState();
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const key = (await (await fetch(PUSH_URL + '/vapid')).text()).trim();
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
    }
    lastSynced = null; await syncPush(sub);
    reg.showNotification('通知を受け取れるようになりました', { body: '画面を閉じていても、順番が来たらお知らせします。', icon: 'icon-192.png' });
  } catch (e) { alert('通知をオンにできませんでした：' + (e && e.message ? e.message : e)); }
  refreshPushState();
}
const pushUi = () => {
  if (pushState === 'on') return '<div class="small c">✅ 画面を閉じていても、通知が届きます</div>';
  if (pushState === 'off') return '<button class="btn" id="pushBtn">📲 画面を閉じていても通知を受け取る</button>';
  if (pushState === 'denied') return '<div class="small c">通知がブロックされています。ブラウザの設定で、このサイトの通知を許可してください。</div>';
  if (pushState === 'needInstall') return '<div class="card small"><b>画面を閉じていても通知を受け取るには（iPhone）</b><br>①下の共有ボタン（□に↑）を押す　②「ホーム画面に追加」を押す　③ホーム画面にできたアイコンから開き直す<br>（今の整理券は、そのまま引き継がれます）</div>';
  return '';
};
if (PUSH_URL && pushOk && !(isIOS && !isStandalone)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- データ ---------- */
function subMe() {
  if (unsubMe) { unsubMe(); unsubMe = null; }
  if (!myId) { me = null; render(); return; }
  const id = myId;
  unsubMe = db.collection('tickets').doc(id).onSnapshot({ includeMetadataChanges: true }, d => {
    okSnap(d);
    if (!d.exists) { try { localStorage.removeItem(KEY); } catch (e) {} myId = null; me = null; st = {}; }
    else { try { const u = new URL(location.href); if (u.searchParams.get('t') !== id) { u.searchParams.set('t', id); history.replaceState(null, '', u); } } catch (e) {} me = { id, ...d.data() }; if (me.status === 'arrived') me.status = 'inroom'; if (me.status === 'skipped') { me.status = 'called'; me.skipped = true; } }
    render();
  });
}
async function issue() {
  const name = nick.trim().slice(0, 12);
  if (!name) { formErr = 'ニックネームを入力してください'; render(); return; }
  if (busy) return; busy = true; formErr = ''; render();
  const ref = db.collection('counters').doc(today());
  const newRef = db.collection('tickets').doc();
  try {
    await db.runTransaction(async tx => {
      const c = await tx.get(ref);
      if (c.exists && c.data().closed) throw new Error('closed');
      const n = (c.exists ? c.data().last || 0 : 0) + 1;
      tx.set(ref, { last: n }, { merge: true });
      const t = { day: today(), number: n, name, people, status: 'waiting', createdAt: Date.now() };
      if (TEST) t.test = true;
      tx.set(newRef, t);
    });
    myId = newRef.id;
    try { localStorage.setItem(KEY, myId); localStorage.setItem('seiriken-nick', name); } catch (e) {}
    busy = false; lastSynced = null; subMe(); refreshPushState();
  } catch (err) {
    busy = false; formErr = err.message === 'closed' ? 'ただいま整理券を発行できません' : '整理券を発行できませんでした。もう一度お試しください'; render();
  }
}
function leave() { try { localStorage.removeItem(KEY); const u = new URL(location.href); u.searchParams.delete('t'); history.replaceState(null, '', u); } catch (e) {} myId = null; me = null; st = {}; stopRing(); subMe(); }

/* ---------- 画面 ---------- */
const shell = (bg, top, bottom) => { document.body.className = 'st-' + bg; return `<div class="scr"><div class="top">${usrTag()}${TEST ? '<div class="banner test">テストモードです（テスト用の整理券）</div>' : ''}${top}</div><div class="bottom">${bottom || ''}${me && (TEST || cfg.multiTicket !== false) && !['cancelled', 'absent', 'inroom', 'guided'].includes(me.status) ? `<div class="c"><button class="linkbtn" id="another">別の整理券を発行する${TEST ? '（テスト用）' : ''}</button></div>` : ''}<div class="small c upd">最終更新 <span id="last">${fmtHMS(lastOk)}</span>　<button class="linkbtn" id="refresh">更新する</button></div></div></div>`; };
const notifyBtn = () => `<button class="btn ${audioOn() ? 'sub' : ''}" id="notif">${audioOn() ? '🔔 通知オン（タップで音を確認）' : '🔕 タップして音をオンにする'}</button><div class="small c" id="vibNote">iPhoneでは振動しません。この画面を開いたままにしてください。</div>`;
const cancelBtn = () => '<div class="c"><button class="linkbtn" id="cancel">整理券をキャンセルする</button></div>';
// 半券。もぎる前の面（sf）を2枚重ね、なぞった位置から左側を めくれた面（flap）として持ち上げる
// 半券。なぞった位置から左側が、ギザギザの切り口で消えていく
const stubFace = (handle) => `<div class="sf"><div class="strack"><span class="stx">受付でめくってください</span>${handle || ''}</div></div>`;
const stubHtml = (enabled) => enabled
  ? `<div class="sl base">${stubFace()}</div><div class="tear" id="tear"><div class="tear-h" id="tearH">➜</div></div>`
  : `<div class="off">${stubFace('<div class="tear-h">🔒</div>')}</div>`;

const usrTag = () => me && me.name ? `<div class="usr">${esc(me.name)}さん</div>` : '';
const tkHead = `<div class="tk-title">${esc(EVENT_TITLE)}</div><div class="tk-lab">整理券</div><div class="tk-note">待機室までの整理券です</div>`;

function viewIssue() {
  const wc = sum.waitCount || 0, mins = Math.round(wc * gapSec() / 60);
  const head = `<div class="card c"><div class="lab">現在の待ち</div><div class="huge">${wc}<span class="h1">組</span></div><div class="p">${wc ? (showWait() ? `待ち時間の目安：約${Math.max(1, mins)}分` : '') : '待ちはありません。すぐにご案内できます。'}</div></div>`;
  if (cfg.closed) {
    return shell('stop', head + `<div class="card c"><div class="h1">ただいま整理券の発行を<br>一時停止しています</div>
      ${cfg.closedReason ? `<p class="p">理由：${esc(cfg.closedReason)}</p>` : ''}
      ${cfg.reopenAt ? `<p class="p">再開の予定：${esc(cfg.reopenAt)}</p>` : ''}
      <p class="small">ご不明な点は、会場のスタッフにお声がけください。</p></div>`, '');
  }
  return shell('none', head + `<div class="tk"><div class="tk-main full">${tkHead}
      <div class="lab" style="margin-top:10px;text-align:left">ニックネーム（12文字まで）</div>
      <input class="field" id="nick" maxlength="12" placeholder="例：たろう" value="${esc(nick)}" autocomplete="off">
      <div class="lab" style="margin-top:10px;text-align:left">人数</div><div class="seg" style="margin-top:8px"><button data-p="1" class="${people === 1 ? 'on' : ''}">1人</button><button data-p="2" class="${people === 2 ? 'on' : ''}">2人</button></div>
      ${formErr ? `<div class="err c" style="margin-top:8px">${esc(formErr)}</div>` : ''}</div></div>`,
    `<button class="btn" id="issue" ${busy ? 'disabled' : ''}>${busy ? '発行しています…' : '整理券を発行する'}</button>`);
}

function viewTicket() {
  const li = line(), idx = li.indexOf(me.number);
  const ahead = idx >= 0 ? idx : li.filter(n => n < me.number).length;
  const ppl = `${me.people}名`;
  const body = extra => `<div class="tk-main">${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div>${extra || ''}</div>`;
  const perf = '<div class="tk-perf"><i class="n l"></i><i class="n r"></i><div class="zig"></div></div>';

  if (me.status === 'called') {
    return shell('call', `<div class="h1 c" id="hd" style="font-size:clamp(24px,7.4vw,34px)">受付までお越しください</div>
      <div class="tk call">${body()}${perf}<div class="tk-stub">${stubHtml(true)}</div></div>
      ${me.skipped ? '<div class="small c">順番を少し後ろにしています。着いたら、受付でめくってスタッフにお見せください。</div>' : ''}${tearErr ? '<div class="err c" id="tearErr">通信できませんでした。もう一度なぞってください</div>' : ''}`,
      `<div class="small c">受付で、半券を右になぞってめくり、スタッフにこの画面をお見せください。画面をタップすると音が止まります。</div>`);
  }
  if (me.status === 'inroom' || me.status === 'guided') {
    return shell('in', `<div class="h1 c" style="font-size:clamp(24px,7.4vw,34px)">入室しました</div>
      <div class="tk in"><div class="tk-main cut"><div class="stamp">入室済み</div>${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div></div><div class="tk-perf"><div class="zig"></div></div></div>
      <div class="tk-times c"><div><span>入室</span><b>${me.enteredAt ? fmtHMS(me.enteredAt) : ''}</b></div><div><span>現在</span><b id="clk"></b></div></div>
      <div class="small c">このあとは、スタッフの案内に従ってください。</div>`,
      '<button class="btn sub" id="again">新しい整理券を発行する</button>');
  }
  if (me.status === 'cancelled') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">キャンセルしました</div></div></div>`, '<button class="btn sub" id="again">新しい整理券を発行する</button>');
  if (me.status === 'absent') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">この整理券は<br>無効になりました</div><p class="p c">ご利用の場合は、スタッフにお声がけください。</p></div></div>`, '<button class="btn sub" id="again">新しい整理券を発行する</button>');

  // 順番待ち（発行したときから、チケットの形で表示する）
  const soon = ahead <= SOON_AHEAD;
  const eta = etaText(ahead);
  const aheadTxt = `あと${ahead + 1}<span class="h1">組</span>`; // あと1組＝次に呼ばれる
  // 呼び出しの順番（先頭の5組だけ表示）
  const chip = (n, i, me_) => `<span class="oc ${me_ ? 'me' : ''}"><small>${i + 1}番目</small>${n}番</span>`;
  const chips = li.slice(0, 5).map((n, i) => chip(n, i, n === me.number)).join('');
  const orderRow = idx >= 0 ? `<div class="tk-order"><div class="tk-lab" style="letter-spacing:.1em">呼び出しの順番</div><div class="ocs">${chips}</div><div class="small c" style="margin-top:6px">左から順にお呼びします</div></div>` : '';
  const info = `<div class="tk-eta"><div class="huge" style="font-size:clamp(44px,14vw,64px)">${aheadTxt}</div><div class="p">${soon ? 'まもなくお呼びします' : showWait() ? `目安：${eta}ごろ` : 'この画面でお待ちください'}</div></div>`;
  const top = (soon ? '<div class="h1 c" style="font-size:clamp(22px,6.4vw,30px)">会場の近くでお待ちください</div>' : '')
    + `<div class="tk wait">${body(info + orderRow)}${perf}<div class="tk-stub">${stubHtml(false)}</div></div>`
    + (soon ? '' : `<div class="card p">${showWait() ? eta + 'ごろに、会場へお戻りください。' : ''}この画面を開いたままにしておくと、音でもお知らせします。</div>`);
  return shell(soon ? 'soon' : 'wait', top, notifyBtn() + pushUi() + cancelBtn());
}

function render() {
  if (dragging || (document.activeElement && document.activeElement.id === 'nick')) { pending = true; return; }
  if (!me) { app.innerHTML = viewIssue(); wire(); stopRing(); return; }
  // 状態の変化に合わせて音・振動・通知
  const li = line(), idx = li.indexOf(me.number), ahead = idx >= 0 ? idx : li.filter(n => n < me.number).length;
  const key = me.status === 'waiting' ? (ahead <= SOON_AHEAD ? 'soon' : 'wait') : me.status;
  const changed = st.key !== undefined && st.key !== key;
  if (changed && key === 'soon') { beep(2); vibrate([300, 150, 300]); note('整理券 ' + me.number, 'まもなく順番です。会場の近くでお待ちください'); }
  if (key === 'called' && (st.key !== 'called')) { startRing(); note('整理券 ' + me.number, '受付までお越しください'); }
  if (key !== 'called') stopRing();
  if (me.status === 'called' && me.reNotifiedAt != null && st.re != null && st.re !== me.reNotifiedAt) { startRing(); note('整理券 ' + me.number, 'お待ちしています。受付までお越しください'); }
  st.re = me.reNotifiedAt != null ? me.reNotifiedAt : null; st.key = key;
  app.innerHTML = viewTicket();
  document.title = key === 'called' ? '【受付までお越しください】整理券' : '整理券';
  wire(); tick();
}

function wire() {
  const $ = id => document.getElementById(id);
  if ($('nick')) { $('nick').oninput = e => { nick = e.target.value; }; $('nick').onblur = () => { if (pending && !dragging) { pending = false; setTimeout(render, 0); } }; }
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { people = +b.dataset.p; render(); });
  if ($('issue')) $('issue').onclick = () => { ensureAudio(); issue(); };
  if ($('notif')) $('notif').onclick = async () => {
    await ensureAudio(); beep(2); updNotif();
    // 振動の確認（対応していない端末では、その旨を表示する）
    let vib = false; try { vib = !!(navigator.vibrate && navigator.vibrate([250, 120, 250])); } catch (e) {}
    const vn = document.getElementById('vibNote');
    if (vn) vn.textContent = vib ? '振動しましたか？ しない場合は、スマホの設定で、振動やマナーモードを確認してください。' : 'この端末のブラウザは、振動に対応していません（iPhoneなど）。音でお知らせします。';
    try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {}
  };
  if ($('cancel')) $('cancel').onclick = () => {
    if (!confirm('整理券をキャンセルします。\nよろしいですか？（元には戻せません）')) return;
    const ref = db.collection('tickets').doc(me.id), now = Date.now();
    // 新しいルールでは cancelledBy も書ける。古いルールのままでも動くよう、拒否されたら cancelledBy なしでやり直す
    ref.update({ status: 'cancelled', cancelledAt: now, cancelledBy: 'customer' })
      .catch(() => ref.update({ status: 'cancelled', cancelledAt: now }))
      .catch(() => alert('キャンセルできませんでした。もう一度お試しください'));
  };
  if ($('pushBtn')) $('pushBtn').onclick = enablePush;
  if ($('refresh')) $('refresh').onclick = () => { subAll(); };
  if ($('again')) $('again').onclick = leave;
  if ($('another')) $('another').onclick = () => { if (confirm('この端末に表示している整理券を外して、新しい整理券を発行します。\n今の整理券は、順番待ちの列に残ります。')) leave(); };
  setupTear();
}

/* ---------- 半券をめくる ---------- */
let tearErr = false;
const ANDROID = /Android/i.test(navigator.userAgent);
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function setupTear() {
  const tr = document.getElementById('tear'), h = document.getElementById('tearH');
  if (!tr || !h) return;
  const tk = tr.closest('.tk');
  let sx = 0, drag = false, max = 1, x = 0, raf = 0, lastStep = 0, busy = false;
  const paint = () => { raf = 0; h.style.transform = `translateX(${x}px)`; tk.style.setProperty('--p', x / max); };
  h.onpointerdown = e => {
    if (busy) return;
    drag = true; dragging = true; sx = e.clientX; x = 0; lastStep = 0; h.style.opacity = '';
    tk.classList.remove('snap');
    max = Math.max(1, tr.clientWidth - h.offsetWidth - 8);
    h.setPointerCapture(e.pointerId);
  };
  h.onpointermove = e => {
    if (!drag) return;
    x = Math.max(0, Math.min(max, e.clientX - sx));
    if (!raf) raf = requestAnimationFrame(paint);
    const step = Math.floor(x / max * 10);
    if (step > lastStep && ANDROID) vibrate(6); // 10%進むごとに「プチ」
    lastStep = Math.max(lastStep, step);
    if (x >= max) finish();
  };
  const finish = () => {
    if (!drag) return; drag = false; busy = true;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    tear(tr, tk, h).then(ok => { busy = false; if (!ok) { x = 0; h.style.transform = ''; } });
  };
  const end = () => {
    if (!drag) return;
    if (x >= max * 0.85) { finish(); return; }
    drag = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    // ばねのように元の位置へ
    tk.classList.add('snap'); h.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)';
    h.style.transform = 'translateX(0)'; tk.style.setProperty('--p', 0);
    setTimeout(() => { h.style.transition = ''; tk.classList.remove('snap'); dragging = false; if (pending) { pending = false; render(); } }, 320);
  };
  h.onpointerup = end; h.onpointercancel = end;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// もぎる。最後まで破り切る → 半券が落ちる → はんこ → 入室済み画面へ（見た目をそろえてあるので、つなぎ目は出ない）
async function tear(tr, tk, h) {
  const stub = tk.querySelector('.tk-stub'), main = tk.querySelector('.tk-main'), hd = document.getElementById('hd');
  const stampEl = document.createElement('div'); stampEl.className = 'stamp pop'; stampEl.textContent = '入室済み';
  const fail = () => {
    tearErr = true; dragging = false;
    // 落ちた半券を、フェードインで元に戻す
    stampEl.remove(); tk.classList.remove('ripped', 'fin', 'in', 'shake'); tk.classList.add('call', 'back');
    tk.style.setProperty('--p', 0); h.style.transform = ''; h.style.transition = ''; h.style.opacity = '';
    if (hd) hd.textContent = '受付までお越しください';
    document.body.className = 'st-call'; startRing();
    if (!document.getElementById('tearErr')) tk.insertAdjacentHTML('afterend', '<div class="err c" id="tearErr">通信できませんでした。もう一度なぞってください</div>');
    setTimeout(() => tk.classList.remove('back'), 400);
    if (pending) { pending = false; }
    return false;
  };
  // 通信できないときは、動かす前にやめる
  if (navigator.onLine === false) { tk.classList.add('snap'); h.style.transform = ''; tk.style.setProperty('--p', 0); setTimeout(() => tk.classList.remove('snap'), 320); tearErr = true; dragging = false; if (!document.getElementById('tearErr')) tk.insertAdjacentHTML('afterend', '<div class="err c" id="tearErr">通信できませんでした。もう一度なぞってください</div>'); return false; }
  tearErr = false; const old = document.getElementById('tearErr'); if (old) old.remove();
  stopRing(); ensureAudio(); rip(); vibrate([60, 40, 90]);
  const reduce = reduceMotion();
  let failed = false;
  const save = db.collection('tickets').doc(me.id).update({ status: 'inroom', enteredAt: Date.now(), torn: true });
  const result = Promise.race([save.then(() => true), sleep(5000).then(() => { throw new Error('timeout'); })]);
  result.catch(() => { failed = true; });
  // 1. 残りを一気に破り切る
  tk.classList.add('fin'); tk.style.setProperty('--p', 1); h.style.transition = 'opacity .1s'; h.style.opacity = 0;
  await sleep(120); if (failed) return fail();
  // 2. 半券が浮いて、落ちていく
  tk.classList.remove('fin');
  stub.style.setProperty('--fx', (Math.random() * 40 - 20).toFixed(0) + 'px');
  stub.style.setProperty('--fr', ((Math.random() < .5 ? -1 : 1) * (14 + Math.random() * 8)).toFixed(0) + 'deg');
  tk.classList.add('ripped');
  await sleep(reduce ? 200 : 300); if (failed) return fail();
  // 3. はんこ。同時に震えて、背景が入室済みの緑へ
  main.appendChild(stampEl);
  if (!reduce) { tk.classList.add('shake'); setTimeout(() => tk.classList.remove('shake'), 90); }
  tk.classList.remove('call'); tk.classList.add('in');
  if (hd) hd.textContent = '入室しました';
  document.body.className = 'st-in';
  await sleep(reduce ? 300 : 500); if (failed) return fail();
  try { await result; } catch (e) { return fail(); }
  // 4. 完成した見た目のまま、入室済み画面に切り替える
  dragging = false; pending = false; render();
  return true;
}

/* ---------- 時計 ---------- */
function tick() { const c = document.getElementById('clk'); if (c) c.textContent = fmtHMS(Date.now()); }
setInterval(tick, 500);

/* ---------- 購読（画面を開き直したときなどに、つなぎ直す） ---------- */
let unsubs = [], lastOk = Date.now();
const stamp = () => { const e = document.getElementById('last'); if (e) e.textContent = fmtHMS(lastOk); };
const okSnap = d => { if (!d.metadata.fromCache) { lastOk = Date.now(); stamp(); } };
function subAll() {
  unsubs.forEach(u => u()); unsubs = [];
  unsubs.push(db.collection('counters').doc(today()).onSnapshot({ includeMetadataChanges: true }, d => { okSnap(d); cfg = d.exists ? d.data() : {}; render(); }));
  unsubs.push(summaryRef().onSnapshot({ includeMetadataChanges: true }, d => { okSnap(d); sum = d.exists ? d.data() : {}; render(); }));
  subMe();
}
// 別のアプリから戻ったときや、通信が復活したときは、つなぎ直して最新の状態を取り直す
document.addEventListener('visibilitychange', () => { if (!document.hidden) subAll(); });
addEventListener('pageshow', e => { if (e.persisted) subAll(); });
addEventListener('online', subAll);
subAll();
refreshPushState();
