<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3a7d6e"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"><link rel="stylesheet" href="customer.css?v=69"></head>
<body class="st-none"><div id="net" role="status" hidden></div><div id="app"><div class="scr"><p class="c small">読み込み中…</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=69"></script><script src="common.js?v=69"></script>
<script>
const KEY = 'seiriken-' + today();
const TEST = /[?&]test=1/.test(location.search);
let myIds = [], people = 1, nick = '', formErr = '', busy = false;
let me = null, sum = {}, cfg = {}, dragging = false, pending = false;
try { myIds = (localStorage.getItem(KEY) || new URLSearchParams(location.search).get('t') || '').split(',').filter(Boolean); nick = localStorage.getItem('seiriken-nick') || ''; } catch (e) {}
const app = document.getElementById('app');
const line = () => sum.line || [];
const showWait = () => waitModeOf(cfg) !== 'off';
const gapSec = () => gapSecOf(cfg, sum.avgGapSec);
const fmtHM = d => d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
const fmtHMS = ms => new Date(ms).toLocaleTimeString('ja-JP', { hour12: false });
// 今から、あと何分くらいか（あと○組ぶん）
const waitMin = n => waitMinutes(n, cfg, sum.avgGapSec);

const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }; // 半券をなぞるときの手ごたえだけに使う

/* ---------- データ ---------- */
const MAX_PEOPLE = 8;
let mine = {}, selId = null, sig = '', unsubsMe = [];
function saveIds() {
  try {
    const u = new URL(location.href);
    if (myIds.length) { localStorage.setItem(KEY, myIds.join(',')); u.searchParams.set('t', myIds.join(',')); }
    else { localStorage.removeItem(KEY); u.searchParams.delete('t'); }
    history.replaceState(null, '', u);
  } catch (e) {}
}
// 画面に出す券：呼び出し中があればそれ、なければ順番待ちの先頭。券の状態が変わったら、自分で選んだ券より優先して切り替える
function pickMe() {
  const ts = myIds.map(id => mine[id]).filter(Boolean);
  const s = ts.map(t => t.id + t.status).join();
  if (s !== sig) { sig = s; selId = null; }
  me = (selId && mine[selId]) || ts.find(t => t.status === 'called') || ts.find(t => t.status === 'waiting') || ts[0] || null;
}
function subMe() {
  unsubsMe.forEach(u => u()); unsubsMe = [];
  if (!myIds.length) { me = null; syncSum(); render(); return; }
  myIds.slice().forEach(id => {
    unsubsMe.push(db.collection('tickets').doc(id).onSnapshot({ includeMetadataChanges: true }, d => {
      okSnap(d);
      // 券が消えたと分かるのは、サーバーの答えのときだけ。端末の保存分だけ（電波が戻る前など）で「ない」と出ても、券の記録は消さない
      if (!d.exists) { if (d.metadata.fromCache) return; delete mine[id]; myIds = myIds.filter(x => x !== id); saveIds(); }
      else { const t = { id, ...d.data() }; if (t.status === 'arrived') t.status = 'inroom'; if (t.status === 'skipped') t.status = 'called'; mine[id] = t; }
      pickMe(); syncSum(); render();
    }, errSnap));
  });
}
async function issue() {
  const name = nick.trim().slice(0, 12);
  if (!name) { formErr = 'ニックネームを入力してください'; render(); return; }
  if (busy) return; busy = true; formErr = ''; render();
  const parts = splitPeople(people);
  const ref = db.collection('counters').doc(today());
  const refs = parts.map(() => db.collection('tickets').doc());
  // 発券した時の目安の時刻を券に書く（あとで1組の間隔を変えても、この券の時刻は変えない）
  const etas = waitModeOf(cfg) === 'off' || !sum.line ? [] : (ch => parts.map((p, i) => Math.ceil(ch[-(i + 1)] / 60000) * 60000))(etaChain((sum.line || []).concat(parts.map((p, i) => -(i + 1))), sum.pe, cfg, sum.avgGapSec, Date.now()));
  try {
    await db.runTransaction(async tx => {
      const c = await tx.get(ref);
      if (c.exists && c.data().closed) throw new Error('closed');
      const n0 = c.exists ? c.data().last || 0 : 0, g0 = c.exists ? c.data().gLast || 0 : 0;
      // 複数枚のときは、同じ人の券に同じ枝番（a, b, … z の次は a に戻る）を付ける
      const grp = parts.length > 1 ? grpLetter(g0) : null;
      tx.set(ref, parts.length > 1 ? { last: n0 + parts.length, gLast: g0 + 1 } : { last: n0 + parts.length }, { merge: true });
      parts.forEach((p, i) => {
        const t = { day: today(), number: n0 + 1 + i, name, people: p, status: 'waiting', createdAt: Date.now() };
        if (etas[i]) t.etaAt = etas[i];
        if (grp) t.grp = grp;
        if (TEST) t.test = true;
        tx.set(refs[i], t);
      });
    });
    myIds = refs.map(r => r.id); mine = {}; selId = null; sig = '';
    try { localStorage.setItem('seiriken-nick', name); } catch (e) {}
    saveIds(); busy = false; subMe();
  } catch (err) {
    busy = false; formErr = errText('IS', err); render();
  }
}
function leave() { myIds = []; mine = {}; selId = null; sig = ''; saveIds(); me = null; subMe(); }
const allEnded = () => myIds.map(id => mine[id]).filter(Boolean).every(t => ['inroom', 'guided', 'cancelled', 'absent'].includes(t.status));

/* ---------- 画面 ---------- */
const shell = (bg, top, bottom) => { document.body.className = 'st-' + bg; return `<div class="scr"><div class="top">${usrTag()}${noticeCard()}${tabsHtml()}${dmCard()}${TEST ? '<div class="banner test">テストモードです（テスト用の整理券）</div>' : ''}${top}</div><div class="bottom">${bottom || ''}${me && (TEST || cfg.multiTicket !== false) && !['cancelled', 'absent', 'inroom', 'guided'].includes(me.status) ? `<div class="c"><button class="linkbtn" id="another">別の整理券を発行する${TEST ? '（テスト用）' : ''}</button></div>` : ''}${me ? '<div class="c"><button class="linkbtn" id="reportBtn">受付にメッセージを送る</button></div>' : ''}<div class="small c upd">最終更新 <span id="last">${fmtHMS(lastOk)}</span>　<button class="linkbtn" id="refresh">更新する</button></div>${me ? '' : '<div class="c staffl"><a href="admin.html">スタッフ用ログイン</a></div>'}</div></div>`; };
const tabState = t => ({ called: '呼び出し', waiting: '順番待ち', inroom: '入室済み', guided: '入室済み', cancelled: 'キャンセル', absent: '無効' })[t.status] || '';
// 3人以上のときは、2人1組ずつ別の整理券になる。券を切り替えるタブ
const tabsHtml = () => {
  const ts = myIds.map(id => mine[id]).filter(Boolean).sort((a, b) => a.number - b.number);
  if (ts.length < 2) return '';
  return `<div class="tabs-note">整理券は${ts.length}枚あります。呼ばれた券から、順にもぎってください。</div><div class="tabs">${ts.map(t => `<button data-tab="${t.id}" class="${me && me.id === t.id ? 'on' : ''} ${t.status === 'called' ? 'called' : ''}"><b>${t.number}番</b><small>${t.people}名・${tabState(t)}</small></button>`).join('')}</div>`;
};
const againBtn = () => allEnded() ? '<button class="btn sub" id="again">新しい整理券を発行する</button>' : '';
const cancelBtn = () => '<div class="c"><button class="linkbtn" id="cancel">整理券をキャンセルする</button></div>';
// 半券：整理券番号の控え。同じ見た目の層を2枚重ね、指より左（もう破れた側）を左の層に見せる
const stubPaper = hint => `<div class="sp"><div class="sp-row"><span class="sp-lab">半券</span><span class="sp-num">${me.number}番</span></div>${hint ? `<div class="sp-hint">${hint}</div>` : ''}</div>`;
const stubHtml = enabled => enabled
  ? `<div class="slw r"><div class="sl">${stubPaper('受付でもぎってください')}</div></div><div class="slw l"><div class="sl">${stubPaper('受付でもぎってください')}</div></div>`
  : `<div class="off">${stubPaper('')}</div>`;

// 受付とのダイレクトメッセージ（dm の並び。common.js の dmList など）
const bubHtml = (m, t) => `<div class="bub ${m.f}"><div class="bt">${esc(m.t)}</div><small>${m.f === 's' ? '受付' : 'あなた'}　${fmtHM(new Date(m.at))}${m.f === 'c' && t.dmReadAt >= m.at ? '　既読' : ''}</small></div>`;
const dmCard = () => {
  if (!me || !dmList(me).length || !['waiting', 'called'].includes(me.status)) return '';
  const n = dmList(me).length;
  return `<div class="msgc"><b>受付とのダイレクトメッセージ</b>${dmList(me).slice(-2).map(m => bubHtml(m, me)).join('')}<div class="mf"><span></span><button class="linkbtn" id="dmOpen">${n > 2 ? '全部見る・返信' : '返信する'}</button></div></div>`;
};
// 全員へのお知らせ（スタッフが設定。閉じた人には、同じお知らせをもう出さない）
const noticeClosed = () => { try { return localStorage.getItem('seiriken-nd') === String(cfg.noticeAt); } catch (e) { return false; } };
const noticeCard = () => cfg.notice && !noticeClosed() ? `<div class="msgc all"><b>全体へのお知らせ</b><div class="mt">${esc(cfg.notice)}</div><div class="mf">${cfg.noticeAt ? `<small>${fmtHM(new Date(cfg.noticeAt))}</small>` : '<small></small>'}<button class="btn sub" id="noticeClose">閉じる</button></div></div>` : '';
const usrTag = () => me && me.name ? `<div class="usr">${esc(me.name)}さん</div>` : '';
const tkHead = `<div class="tk-band"><span>${esc(EVENT_TITLE)}</span><small>整理券</small></div>`;

function viewIssue() {
  const wc = sum.waitCount || 0, mins = waitMin(wc);
  const head = `<div class="card c"><div class="lab">現在の待ち</div><div class="huge">${wc}<span class="h1">組</span></div><div class="p">${wc ? (showWait() ? `待ち時間の目安：約${mins}分` : '') : '待ちはありません。すぐにご案内できます。'}</div></div>`;
  if (cfg.closed) {
    return shell('stop', head + `<div class="card c"><div class="h1">ただいま整理券の発行を<br>一時停止しています</div>
      ${cfg.closedReason ? `<p class="p">理由：${esc(cfg.closedReason)}</p>` : ''}
      ${cfg.reopenAt ? `<p class="p">再開の予定：${esc(cfg.reopenAt)}</p>` : ''}
      <p class="small">ご不明な点は、会場のスタッフにお声がけください。</p></div>`, '');
  }
  return shell('none', head + `<div class="tk"><div class="tk-main full">${tkHead}
      <div class="lab" style="margin-top:10px;text-align:left">ニックネーム（12文字まで）</div>
      <input class="field" id="nick" maxlength="12" placeholder="例：たろう" value="${esc(nick)}" autocomplete="off">
      <div class="lab" style="margin-top:10px;text-align:left">人数</div>
      <div class="step"><button data-pd="-1" aria-label="1人減らす" ${people <= 1 ? 'disabled' : ''}>−</button><div class="sn">${people}<small>人</small></div><button data-pd="1" aria-label="1人増やす" ${people >= MAX_PEOPLE ? 'disabled' : ''}>＋</button></div>
      <div class="small c" style="margin-top:6px">${people <= 2 ? '整理券は1枚です' : `2人1組で1枚です。整理券は${splitPeople(people).length}枚になります（${splitPeople(people).join('名・')}名）`}</div>
      ${formErr ? `<div class="err c" style="margin-top:8px">${esc(formErr)}</div>` : ''}</div></div>`,
    `<button class="btn" id="issue" ${busy ? 'disabled' : ''}>${busy ? '発行しています…' : people > 2 ? `整理券を${splitPeople(people).length}枚発行する` : '整理券を発行する'}</button>`);
}

function viewTicket() {
  const li = line(), idx = li.indexOf(me.number);
  const ahead = idx >= 0 ? idx : li.filter(n => n < me.number).length;
  const ppl = `${me.people}名`;
  const body = extra => `<div class="tk-main">${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div>${extra || ''}</div>`;
  // 切り取り線。左端の丸い切り込みに、丸いつまみを置く（呼ばれる前はグレー）
  const perf = on => `<div class="tk-perf"><i class="n l"></i><i class="n r"></i><div class="zig"></div>${on ? '<div class="tear-h" id="tearH"><span class="tl">なぞってもぎる →</span></div>' : '<div class="tear-h off"></div>'}</div>`;

  if (me.status === 'called') {
    return shell('call', `<div class="h1 c" id="hd" style="font-size:clamp(24px,7.4vw,34px)">受付へお越しください</div>
      <div class="tk call">${body()}${perf(true)}<div class="tk-stub">${stubHtml(true)}</div></div>
      ${tearErr ? `<div class="err c" id="tearErr">${esc(tearErr)}</div>` : ''}`,
      `<div class="small c">受付で、丸いつまみから右へなぞって半券をもぎり、スタッフにこの画面をお見せください。</div>`);
  }
  if (me.status === 'inroom' || me.status === 'guided') {
    return shell('in', `<div class="h1 c" style="font-size:clamp(24px,7.4vw,34px)">入室しました</div>
      <div class="tk in"><div class="tk-main cut"><div class="stamp">入室済み</div>${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div></div><div class="tk-perf"><div class="zig"></div></div></div>
      <div class="tk-times c"><div><span>入室</span><b>${me.enteredAt ? fmtHMS(me.enteredAt) : ''}</b></div><div><span>現在</span><b id="clk"></b></div></div>
      <div class="small c">このあとは、スタッフの案内に従ってください。</div>`,
      againBtn());
  }
  if (me.status === 'cancelled') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">キャンセルしました</div></div></div>`, againBtn());
  if (me.status === 'absent') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">この整理券は<br>無効になりました</div><p class="p c">ご利用の場合は、スタッフにお声がけください。</p></div></div>`, againBtn());

  // 順番待ち（発行したときから、チケットの形で表示する）
  const soon = ahead <= SOON_AHEAD;
  const nowMs = Date.now(), chain = etaChain(li, me.etaAt ? { ...sum.pe, [me.number]: me.etaAt } : sum.pe, cfg, sum.avgGapSec, nowMs), etaMs = Math.ceil((idx >= 0 ? chain[me.number] : nowMs + waitMin(ahead + 1) * 60000) / 60000) * 60000;
  const etaM = Math.max(1, Math.round((etaMs - nowMs) / 60000)), eta = `約${etaM}分後（${fmtHM(new Date(etaMs))}ごろ）`;
  const aheadTxt = `あと${ahead + 1}<span class="h1">組</span>`; // あと1組＝次に呼ばれる
  const info = `<div class="tk-eta"><div class="huge" style="font-size:clamp(44px,14vw,64px)">${aheadTxt}</div><div class="p">${showWait() ? `目安：${eta}` : 'この画面でお待ちください'}</div></div>`;
  const top = (soon ? '<div class="h1 c" style="font-size:clamp(22px,6.4vw,30px)">会場の近くでお待ちください</div>' : '')
    + `<div class="tk wait">${body(info)}${perf(false)}<div class="tk-stub">${stubHtml(false)}</div></div>`
    + (soon ? '' : `<div class="card p">${showWait() ? eta + 'に、会場へお戻りください。' : ''}この画面を開いたままお待ちください。順番が来ると表示が変わりますので、呼ばれたら受付へお越しください。</div>`);
  return shell(soon ? 'soon' : 'wait', top, cancelBtn());
}

function render() {
  if (dragging || (document.activeElement && document.activeElement.id === 'nick')) { pending = true; return; }
  if (!me) { app.innerHTML = myIds.length ? '<div class="scr"><p class="c small">読み込み中…</p></div>' : viewIssue(); wire(); return; }
  app.innerHTML = viewTicket();
  document.title = me.status === 'called' ? '【受付へお越しください】整理券' : '整理券';
  wire(); tick(); ackSeen(); ackDm(); renderChat();
}

function wire() {
  const $ = id => document.getElementById(id);
  if ($('nick')) { $('nick').oninput = e => { nick = e.target.value; }; $('nick').onblur = () => { if (pending && !dragging) { pending = false; setTimeout(render, 0); } }; }
  document.querySelectorAll('[data-pd]').forEach(b => b.onclick = () => { people = Math.max(1, Math.min(MAX_PEOPLE, people + +b.dataset.pd)); render(); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { selId = b.dataset.tab; pickMe(); render(); });
  if ($('issue')) $('issue').onclick = issue;
  if ($('cancel')) $('cancel').onclick = () => {
    if (!confirm('整理券をキャンセルします。\nよろしいですか？（元には戻せません）')) return;
    const ref = db.collection('tickets').doc(me.id), now = Date.now();
    // 新しいルールでは cancelledBy も書ける。古いルールのままでも動くよう、拒否されたら cancelledBy なしでやり直す
    ref.update({ status: 'cancelled', cancelledAt: now, cancelledBy: 'customer' })
      .catch(() => ref.update({ status: 'cancelled', cancelledAt: now }))
      .catch(e => alert(errText('CA', e)));
  };
  document.querySelectorAll('#reportBtn, #dmOpen').forEach(b => b.onclick = openDm);
  if ($('noticeClose')) $('noticeClose').onclick = () => { try { localStorage.setItem('seiriken-nd', String(cfg.noticeAt)); } catch (e) {} render(); };
  if ($('refresh')) $('refresh').onclick = () => { subAll(); };
  if ($('again')) $('again').onclick = leave;
  if ($('another')) $('another').onclick = () => { if (confirm('この端末に表示している整理券を外して、新しい整理券を発行します。\n今の整理券は、順番待ちの列に残ります。')) leave(); };
  setupTear();
}

/* ---------- 開いたときの確認と、受付への連絡 ---------- */
const NOTICE_KEY = 'seiriken-notice-' + today();
function showNotice() {
  try { if (localStorage.getItem(NOTICE_KEY)) return; } catch (e) {}
  const el = document.createElement('div'); el.className = 'ov'; el.id = 'notice';
  el.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><div class="h1 c">ご確認ください</div><ul class="nl"><li>生徒が開発しているので、万が一整理券が進まないなどの不具合があれば、メッセージ機能または受付にお越しください。</li><li>インターネットが不安定だと、整理券が進まないことがあります。</li><li>一周2名までのご案内となります。</li><li>待ち時間は目安です。</li><li>通知は来ないので、開いたままにしておいてください。</li></ul><button class="btn" id="noticeOk">確認しました</button></div>';
  document.body.appendChild(el);
  document.getElementById('noticeOk').onclick = () => { try { localStorage.setItem(NOTICE_KEY, '1'); } catch (e) {} el.remove(); };
}
showNotice();
// 受付とのダイレクトメッセージ。お客さんが送るのは、1通100文字まで・全部で40通まで
let dmSentAt = 0;
async function sendDm(text, withCode) {
  text = (text || '').trim().slice(0, 100);
  if (!text || !me) return;
  if (dmList(me).length >= 40) throw new Error('full');
  const item = { f: 'c', t: text, at: Date.now() };
  if (withCode && lastErr.at && Date.now() - lastErr.at < 600000) { item.code = lastErr.code; lastErr.at = 0; }
  await Promise.race([db.collection('tickets').doc(me.id).update({ dm: firebase.firestore.FieldValue.arrayUnion(item) }), sleep(8000).then(() => { throw new Error('timeout'); })]);
  dmSentAt = Date.now();
}
function renderChat() {
  const box = document.getElementById('chatList'); if (!box || !me) return;
  const ms = dmList(me), nearEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60, first = !box.dataset.n;
  box.innerHTML = ms.length ? ms.map(m => bubHtml(m, me) + (m.code ? `<div class="bcode ${m.f}">コード ${esc(m.code)}</div>` : '')).join('') : '<p class="small c">まだメッセージはありません。不具合や遅れるときなどは、下から送れます。</p>';
  if (first || (nearEnd && +box.dataset.n !== ms.length)) box.scrollTop = box.scrollHeight;
  box.dataset.n = ms.length;
}
function openDm() {
  if (!me || document.getElementById('dm')) return;
  const el = document.createElement('div'); el.className = 'ov'; el.id = 'dm';
  el.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="dmhead"><div class="h1">受付とのメッセージ</div><button class="btn sub" id="dmX">閉じる</button></div>
    <div class="chat" id="chatList"></div>
    <textarea id="dmText" class="field" rows="2" maxlength="100" placeholder="メッセージ（100文字まで）"></textarea>
    <div class="err c" id="dmMsg" style="margin:4px 0"></div>
    <button class="btn" id="dmSend">送る</button></div>`;
  document.body.appendChild(el);
  const $ = i => document.getElementById(i);
  $('dmX').onclick = () => el.remove();
  $('dmSend').onclick = async () => {
    const t = $('dmText').value.trim();
    if (!t) { $('dmMsg').textContent = '送る内容を選ぶか、書いてください'; return; }
    if (Date.now() - dmSentAt < 3000) { $('dmMsg').textContent = '少し待ってから、もう一度送ってください'; return; }
    $('dmSend').disabled = true; $('dmMsg').textContent = '';
    try { await sendDm(t, true); $('dmText').value = ''; }
    catch (e) { $('dmMsg').textContent = e.message === 'full' ? 'これ以上は送れません。受付にお越しください' : errText('RP', e); }
    $('dmSend').disabled = false;
  };
  renderChat(); ackDm();
}

/* ---------- 半券をもぎる ---------- */
let tearErr = ''; // もぎれなかったときの、原因とコードの文章
const ANDROID = /Android/i.test(navigator.userAgent);
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function setupTear() {
  const h = document.getElementById('tearH');
  if (!h) return;
  const tk = h.closest('.tk');
  let sx = 0, drag = false, max = 1, x = 0, raf = 0, lastStep = 0, busy = false;
  const paint = () => { raf = 0; h.style.transform = `translateX(${x}px)`; tk.style.setProperty('--p', x / max); };
  h.onpointerdown = e => {
    if (busy) return;
    drag = true; dragging = true; sx = e.clientX; x = 0; lastStep = 0; h.style.opacity = '';
    tk.classList.remove('snap'); tk.classList.add('tdrag');
    max = Math.max(1, tk.clientWidth - 72); // つまみの幅と左の余白ぶんを引く
    h.setPointerCapture(e.pointerId); e.preventDefault();
  };
  h.onpointermove = e => {
    if (!drag) return;
    x = Math.max(0, Math.min(max, e.clientX - sx));
    if (!raf) raf = requestAnimationFrame(paint);
    const step = Math.floor(x / max * 10);
    if (step > lastStep && ANDROID) vibrate(6); // 10%進むごとに「プチ」
    lastStep = Math.max(lastStep, step);
    if (x >= max * 0.9) finish();
  };
  const finish = () => {
    if (!drag) return; drag = false; busy = true;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    tear(tk, h).then(ok => { busy = false; if (!ok) x = 0; });
  };
  const end = () => {
    if (!drag) return;
    if (x >= max * 0.7) { finish(); return; }
    drag = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    // ばねのように、左の層の角度とギザギザを元に戻す
    tk.classList.add('snap'); h.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)';
    h.style.transform = 'translateX(0)'; tk.style.setProperty('--p', 0);
    setTimeout(() => { h.style.transition = ''; tk.classList.remove('snap', 'tdrag'); dragging = false; if (pending) { pending = false; render(); } }, 320);
  };
  h.onpointerup = end; h.onpointercancel = end;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tearErrHtml = () => `<div class="err c" id="tearErr">${esc(tearErr)}</div>`;
// もぎる。残りを一気に破り切る → 半券が落ちる → はんこ → 入室済み画面へ（見た目をそろえてあるので、つなぎ目は出ない）
async function tear(tk, h) {
  const stub = tk.querySelector('.tk-stub'), main = tk.querySelector('.tk-main'), hd = document.getElementById('hd');
  const stampEl = document.createElement('div'); stampEl.className = 'stamp pop'; stampEl.textContent = '入室済み';
  const fail = e => {
    tearErr = errText('TR', e); dragging = false;
    // 落ちた半券を、フェードインで元に戻す
    stampEl.remove(); tk.classList.remove('ripped', 'fin', 'in', 'shake', 'tdrag'); tk.classList.add('call', 'back');
    tk.style.setProperty('--p', 0); h.style.transform = ''; h.style.transition = ''; h.style.opacity = '';
    if (hd) hd.textContent = '受付へお越しください';
    document.body.className = 'st-call';
    if (!document.getElementById('tearErr')) tk.insertAdjacentHTML('afterend', tearErrHtml());
    setTimeout(() => tk.classList.remove('back'), 400);
    pending = false;
    return false;
  };
  // 通信できないときは、動かす前に戻す
  if (navigator.onLine === false) {
    tk.classList.add('snap'); h.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)'; h.style.transform = 'translateX(0)'; tk.style.setProperty('--p', 0);
    setTimeout(() => { tk.classList.remove('snap', 'tdrag'); h.style.transition = ''; }, 320);
    tearErr = errText('TR', new Error('offline')); dragging = false;
    if (!document.getElementById('tearErr')) tk.insertAdjacentHTML('afterend', tearErrHtml());
    return false;
  }
  tearErr = ''; const old = document.getElementById('tearErr'); if (old) old.remove();
  vibrate([60, 40, 90]);
  const reduce = reduceMotion();
  let failed = null;
  const save = db.collection('tickets').doc(me.id).update({ status: 'inroom', enteredAt: Date.now(), torn: true });
  const result = Promise.race([save.then(() => true), sleep(5000).then(() => { throw new Error('timeout'); })]);
  result.catch(e => { failed = e; });
  // 1. 右の層も一気に破り切る
  tk.classList.add('fin'); tk.style.setProperty('--p', 1); h.style.transition = 'opacity .1s'; h.style.opacity = 0;
  await sleep(120); if (failed) return fail(failed);
  // 2. 半券全体が、少し浮いてから落ちる
  tk.classList.remove('fin');
  stub.style.setProperty('--fx', (Math.random() * 40 - 20).toFixed(0) + 'px');
  stub.style.setProperty('--fr', (-(14 + Math.random() * 8)).toFixed(0) + 'deg');
  tk.classList.add('ripped');
  await sleep(reduce ? 200 : 300); if (failed) return fail(failed);
  // 3. はんこ。同時に震えて、背景が入室済みの緑へ
  main.appendChild(stampEl);
  if (!reduce) { tk.classList.add('shake'); setTimeout(() => tk.classList.remove('shake'), 90); }
  tk.classList.remove('call'); tk.classList.add('in');
  if (hd) hd.textContent = '入室しました';
  document.body.className = 'st-in';
  await sleep(reduce ? 300 : 500); if (failed) return fail(failed);
  try { await result; } catch (e) { return fail(e); }
  // 4. 完成した見た目のまま、入室済み画面に切り替える
  dragging = false; pending = false; render();
  return true;
}

/* ---------- 時計 ---------- */
function tick() { const c = document.getElementById('clk'); if (c) c.textContent = fmtHMS(Date.now()); }
setInterval(tick, 500);

/* ---------- 通信の警告（A・B・C）と、呼び出しが届いた印（E） ---------- */
// A: 切れた状態が5分続いたら警告  B: つながったら自動で戻る（切れている間は1分ごとにつなぎ直す）
// C: スタッフ画面の更新（1分ごとの生存確認）が5分止まったら警告  E: 呼び出し中の券が画面に出たら seenAt を1回だけ書く
let offSince = 0, watchErr = null, staffStale = 0, backAt = 0, retryAt = 0, ackTried = {};
const errSnap = e => { watchErr = e; netUpdate(); };
function netBack() { if (offSince && Date.now() - offSince >= WARN_MS) backAt = Date.now(); offSince = 0; watchErr = null; netUpdate(); }
const ago = ms => { const m = Math.max(1, Math.round(ms / 60000)); return m + '分'; };
function netUpdate() {
  const el = document.getElementById('net'); if (!el) return;
  const now = Date.now();
  if (navigator.onLine === false && !offSince) offSince = now;
  let cls = '', html = '';
  if (watchErr) {
    const k = causeKey(watchErr);
    cls = 'bad'; html = `<b>最新の状態を取得できません</b><br>原因：${esc(CAUSES[k][0])}。${esc(CAUSES[k][1])}。<small>（エラーコード WT-${k}）</small>`;
  } else if (offSince && now - offSince >= WARN_MS) {
    cls = 'bad'; html = `<b>通信が切れています（${ago(now - offSince)}前から）</b><br>順番が進んでも、この画面には反映されません。電波のよい場所に移動してください。自動でつなぎ直しています。<small>（エラーコード WT-N1）</small>`;
    if (now - retryAt > 60000) { retryAt = now; subAll(); }
  } else if (staffStale) {
    cls = 'warn'; html = `<b>順番の更新が止まっているようです（${ago(staffStale)}以上）</b><br>順番が進んでいない可能性があります。会場のスタッフにお声がけください。<small>（エラーコード WT-S3）</small>`;
  } else if (backAt && now - backAt < 4000) {
    cls = 'ok'; html = '<b>つながりました</b>　最新の状態に更新しました。';
  }
  el.hidden = !html; el.className = cls; if (html && el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } if (!html) el.dataset.h = '';
}
setInterval(netUpdate, 1000);
addEventListener('offline', () => { if (!offSince) offSince = Date.now(); netUpdate(); });
// C: 生存確認の時刻を5分ごとに読む（呼び出し中か、あと少しの券があるときだけ。1回の読み取りで済む）
async function pollStaff() {
  lastPoll = Date.now();
  // 呼び出し中か、前に3組以内の券があるときだけ読む（後ろの方で待つ人は読まない＝読み取りの節約）
  const near = myIds.some(id => { const t = mine[id]; if (!t) return false; if (t.status === 'called') return true; const i = line().indexOf(t.number); return t.status === 'waiting' && i >= 0 && i <= 3; });
  if (document.hidden || !near) { staffStale = 0; return; }
  try {
    const d = await heartbeatRef().get({ source: 'server' });
    const at = d.exists ? d.data().updatedAt : 0, age = Date.now() - at;
    staffStale = at && age >= WARN_MS ? age : 0;
  } catch (e) { /* 通信できないときはAの警告に任せる */ }
  netUpdate();
}
// ふだんは5分ごと。黄色い帯が出ている間だけ1分ごとに見て、スタッフ画面が戻ったらすぐ消す
let lastPoll = 0;
setInterval(() => { if (staffStale || Date.now() - lastPoll >= 295000) pollStaff(); }, 60000); setTimeout(pollStaff, 8000);
// 受付のメッセージが画面に出たら、「既読」の印（dmSeenAt）を、新しいメッセージ1通につき1回だけ書く
function ackDm() {
  if (!me || document.hidden || !(document.getElementById('dm') || ['waiting', 'called'].includes(me.status))) return;
  const m = dmLastStaff(me); if (!m || (me.dmSeenAt || 0) >= m.at) return;
  const k = me.id + ':' + m.at; if (ackTried[k]) return; ackTried[k] = 1;
  db.collection('tickets').doc(me.id).update({ dmSeenAt: Date.now() }).catch(e => { if (e.code !== 'permission-denied') delete ackTried[k]; });
}
function ackSeen() {
  if (!me || me.status !== 'called' || me.seenAt || me.paper || document.hidden || ackTried[me.id]) return;
  const id = me.id; ackTried[id] = 1;
  db.collection('tickets').doc(id).update({ seenAt: Date.now() }).catch(e => { if (e.code !== 'permission-denied') delete ackTried[id]; });
}

/* ---------- 購読（画面を開き直したときなどに、つなぎ直す） ---------- */
let unsubs = [], lastOk = Date.now();
const stamp = () => { const e = document.getElementById('last'); if (e) e.textContent = fmtHMS(lastOk); };
const okSnap = d => {
  watchErr = null;
  if (!d.metadata.fromCache) { lastOk = Date.now(); stamp(); netBack(); }
  else if (!offSince) offSince = Date.now(); // 端末の保存分だけが届いている＝サーバーとつながっていない
};
function subAll() {
  unsubs.forEach(u => u()); unsubs = [];
  if (unsubSum) { unsubSum(); unsubSum = null; }
  subMe(); syncSum();
}
// 集計の購読。入室・取り消しなどで券が全部終わった人は、もう集計の更新を読む必要がないので止める（読み取りの節約）
let unsubSum = null;
function subSum() {
  if (unsubSum) unsubSum();
  unsubSum = summaryRef().onSnapshot({ includeMetadataChanges: true }, d => { okSnap(d); sum = d.exists ? d.data() : {}; cfg = sum.cfg || {}; if (!d.metadata.fromCache && sum.updatedAt && Date.now() - sum.updatedAt < WARN_MS && staffStale) { staffStale = 0; netUpdate(); } render(); }, errSnap);
}
function syncSum() {
  const ts = myIds.map(id => mine[id]).filter(Boolean);
  const finished = ts.length > 0 && ts.length === myIds.length && ts.every(t => ['inroom', 'guided', 'cancelled', 'absent'].includes(t.status));
  if (finished && unsubSum) { unsubSum(); unsubSum = null; }
  else if (!finished && !unsubSum) subSum();
}
// 別のアプリから戻ったときや、通信が復活したときは、つなぎ直して最新の状態を取り直す
// 数秒切り替えただけなら読み直さない（つなぎ直すと読み取りが増える）。しばらく離れていたときだけ取り直す
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else { ackSeen(); ackDm(); pollStaff(); if (Date.now() - hiddenAt > 60000) subAll(); } });
addEventListener('pageshow', e => { if (e.persisted) subAll(); });
addEventListener('online', subAll);
subAll();
</script></body></html>
