<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理券</title><link rel="stylesheet" href="customer.css?v=14"></head>
<body class="st-none"><div id="app"><div class="scr"><p class="c small">読み込み中…</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=14"></script><script src="common.js?v=14"></script>
<script>
const KEY = 'seiriken-' + today();
const TEST = /[?&]test=1/.test(location.search);
let myId = null, people = 1, nick = '', formErr = '', busy = false;
let me = null, sum = {}, cfg = {}, st = {}, unsubMe = null, dragging = false, pending = false;
let soundOn = false;
try { myId = localStorage.getItem(KEY); nick = localStorage.getItem('seiriken-nick') || ''; soundOn = localStorage.getItem('seiriken-sound') === '1'; } catch (e) {}
const app = document.getElementById('app');
const line = () => sum.line || [];
const showWait = () => cfg.showWait !== false;
const gapSec = () => sum.avgGapSec || DEFAULT_GAP_SEC;
const fmtHM = d => d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
const fmtHMS = ms => new Date(ms).toLocaleTimeString('ja-JP', { hour12: false });
// 戻ってきてほしい時刻（5分単位の目安）
function etaText(ahead) { const t = Date.now() + (ahead + 1) * gapSec() * 1000; return fmtHM(new Date(Math.round(t / 300000) * 300000)); }

/* ---------- 音・振動 ---------- */
let actx = null, ringTimer = null, ringSilenced = false;
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', ensureAudio, { passive: true });
function beep(n) {
  if (!actx) return;
  for (let i = 0; i < n; i++) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination); o.frequency.value = i % 2 ? 660 : 880; g.gain.value = 0.3;
    const t = actx.currentTime + i * 0.28; o.start(t); o.stop(t + 0.2);
  }
}
function rip() {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * 0.4), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5) * (0.55 + 0.45 * Math.sin(i / 40));
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.7; g.gain.value = 0.9;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
function note(title, body) { try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) {} }
function ring() { if (ringSilenced) return; beep(3); vibrate([400, 150, 400, 150, 400]); }
function startRing() { stopRing(); ringSilenced = false; ring(); ringTimer = setInterval(ring, 3000); }
function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }
// 呼び出し中は、画面のどこをタップしても音が止まる
document.addEventListener('pointerdown', () => { if (ringTimer) ringSilenced = true; }, { passive: true });

/* ---------- データ ---------- */
function subMe() {
  if (unsubMe) { unsubMe(); unsubMe = null; }
  if (!myId) { me = null; render(); return; }
  const id = myId;
  unsubMe = db.collection('tickets').doc(id).onSnapshot({ includeMetadataChanges: true }, d => {
    okSnap(d);
    if (!d.exists) { try { localStorage.removeItem(KEY); } catch (e) {} myId = null; me = null; st = {}; }
    else { me = { id, ...d.data() }; if (me.status === 'arrived') me.status = 'inroom'; if (me.status === 'skipped') { me.status = 'called'; me.skipped = true; } }
    render();
  });
}
async function issue() {
  const name = nick.trim().slice(0, 12);
  if (!name) { formErr = 'ニックネームを入力してください'; render(); return; }
  if (busy) return; busy = true; formErr = ''; render();
  const ref = db.collection('counters').doc(today());
  const newRef = db.collection('tickets').doc();
  try {
    await db.runTransaction(async tx => {
      const c = await tx.get(ref);
      if (c.exists && c.data().closed) throw new Error('closed');
      const n = (c.exists ? c.data().last || 0 : 0) + 1;
      tx.set(ref, { last: n }, { merge: true });
      const t = { day: today(), number: n, name, people, status: 'waiting', createdAt: Date.now() };
      if (TEST) t.test = true;
      tx.set(newRef, t);
    });
    myId = newRef.id;
    try { localStorage.setItem(KEY, myId); localStorage.setItem('seiriken-nick', name); } catch (e) {}
    busy = false; subMe();
  } catch (err) {
    busy = false; formErr = err.message === 'closed' ? 'ただいま整理券を発行できません' : '整理券を発行できませんでした。もう一度お試しください'; render();
  }
}
function leave() { try { localStorage.removeItem(KEY); } catch (e) {} myId = null; me = null; st = {}; stopRing(); subMe(); }

/* ---------- 画面 ---------- */
const shell = (bg, top, bottom) => { document.body.className = 'st-' + bg; return `<div class="scr"><div class="top">${usrTag()}${TEST ? '<div class="banner test">テストモードです（テスト用の整理券）</div>' : ''}${top}</div><div class="bottom">${bottom || ''}${TEST && me ? '<div class="c"><button class="linkbtn" id="another">別の整理券を発行する（テスト用）</button></div>' : ''}<div class="small c upd">最終更新 <span id="last">${fmtHMS(lastOk)}</span>　<button class="linkbtn" id="refresh">更新する</button></div></div></div>`; };
const notifyBtn = () => `<button class="btn sub" id="notif">${soundOn ? '🔔 通知オン（タップで音を確認）' : '🔔 通知をオンにする'}</button><div class="small c">iPhoneでは振動しません。この画面を開いたままにしてください。</div>`;
const cancelBtn = () => '<div class="c"><button class="linkbtn" id="cancel">整理券をキャンセルする</button></div>';
const stubHtml = (enabled) => `<div class="${enabled ? '' : 'off'}"><div class="tear" id="${enabled ? 'tear' : 'tearOff'}"><div class="tear-txt">${enabled ? '右になぞって、もぎる' : '呼ばれるまで、もぎれません'}</div><div class="tear-h" ${enabled ? 'id="tearH"' : ''}>✂</div></div></div>`;

const usrTag = () => me && me.name ? `<div class="usr">${esc(me.name)}さん</div>` : '';
const tkHead = `<div class="tk-title">${esc(EVENT_TITLE)}</div><div class="tk-lab">整理券</div>`;

function viewIssue() {
  const wc = sum.waitCount || 0, mins = Math.round(wc * gapSec() / 60);
  const head = `<div class="card c"><div class="lab">現在の待ち</div><div class="huge">${wc}<span class="h1">組</span></div><div class="p">${wc ? (showWait() ? `待ち時間の目安：約${Math.max(1, mins)}分` : '') : '待ちはありません。すぐにご案内できます。'}</div></div>`;
  if (cfg.closed) {
    return shell('stop', head + `<div class="card c"><div class="h1">ただいま整理券の発行を<br>一時停止しています</div>
      ${cfg.closedReason ? `<p class="p">理由：${esc(cfg.closedReason)}</p>` : ''}
      ${cfg.reopenAt ? `<p class="p">再開の予定：${esc(cfg.reopenAt)}</p>` : ''}
      <p class="small">ご不明な点は、会場のスタッフにお声がけください。</p></div>`, '');
  }
  return shell('none', head + `<div class="tk"><div class="tk-main full">${tkHead}
      <div class="lab" style="margin-top:10px;text-align:left">ニックネーム（12文字まで）</div>
      <input class="field" id="nick" maxlength="12" placeholder="例：たろう" value="${esc(nick)}" autocomplete="off">
      <div class="lab" style="margin-top:10px;text-align:left">人数</div><div class="seg" style="margin-top:8px"><button data-p="1" class="${people === 1 ? 'on' : ''}">1人</button><button data-p="2" class="${people === 2 ? 'on' : ''}">2人</button></div>
      ${formErr ? `<div class="err c" style="margin-top:8px">${esc(formErr)}</div>` : ''}</div></div>`,
    `<button class="btn" id="issue" ${busy ? 'disabled' : ''}>${busy ? '発行しています…' : '整理券を発行する'}</button>`);
}

function viewTicket() {
  const li = line(), idx = li.indexOf(me.number);
  const ahead = idx >= 0 ? idx : li.filter(n => n < me.number).length;
  const ppl = `${me.people}名`;
  const body = extra => `<div class="tk-main">${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div>${extra || ''}</div>`;
  const perf = '<div class="tk-perf"><i class="n l"></i><i class="n r"></i><div class="tk-cut"></div></div>';

  if (me.status === 'called') {
    return shell('call', `<div class="h1 c">順番が来ました</div>
      <div class="tk call">${body()}${perf}<div class="tk-stub">${stubHtml(true)}</div></div>
      <div class="h1 c" style="font-size:clamp(24px,7vw,32px)">入口前の待合スペースへ<br>お越しください</div>
      ${me.skipped ? '<div class="small c">順番を少し後ろにしています。着いたら、もぎってスタッフにお見せください。</div>' : ''}`,
      `<div class="small c">待合スペースに着いたら、半券を右になぞってもぎり、スタッフにこの画面をお見せください。画面をタップすると音が止まります。</div>`);
  }
  if (me.status === 'inroom' || me.status === 'guided') {
    return shell('in', `<div class="tk in"><div class="tk-main cut"><div class="stamp">入室済み</div>${tkHead}<div class="tk-num">${me.number}</div><div class="tk-who">${ppl}</div>
        <div class="tk-times"><div><span>入室</span><b>${me.enteredAt ? fmtHMS(me.enteredAt) : ''}</b></div><div><span>現在</span><b id="clk"></b></div></div></div></div>
      <div class="small c">このあとは、スタッフの案内に従ってください。</div>`,
      '<button class="btn sub" id="again">新しい整理券を発行する</button>');
  }
  if (me.status === 'cancelled') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">キャンセルしました</div></div></div>`, '<button class="btn sub" id="again">新しい整理券を発行する</button>');
  if (me.status === 'absent') return shell('end', `<div class="tk"><div class="tk-main full">${tkHead}<div class="tk-num">${me.number}</div><div class="h1 c">この整理券は<br>無効になりました</div><p class="p c">ご利用の場合は、スタッフにお声がけください。</p></div></div>`, '<button class="btn sub" id="again">新しい整理券を発行する</button>');

  // 順番待ち（発行したときから、チケットの形で表示する）
  const soon = ahead <= WAITING_ROOM;
  const eta = etaText(ahead);
  const aheadTxt = ahead === 0 ? '次です' : `あと${ahead}<span class="h1">組</span>`;
  const info = `<div class="tk-eta"><div class="huge" style="font-size:clamp(44px,14vw,64px)">${aheadTxt}</div><div class="p">${soon ? 'まもなくお呼びします' : showWait() ? `目安：${eta}ごろ` : 'この画面でお待ちください'}</div></div>`;
  const top = (soon ? '<div class="h1 c" style="font-size:clamp(26px,8vw,34px)">会場へお越しください</div>' : '')
    + `<div class="tk wait">${body(info)}${perf}<div class="tk-stub">${stubHtml(false)}</div></div>`
    + (soon ? '' : `<div class="card p">${showWait() ? eta + 'ごろに、会場へお戻りください。' : ''}この画面を開いたままにしておくと、音でもお知らせします。</div>`);
  return shell(soon ? 'soon' : 'wait', top, notifyBtn() + cancelBtn());
}

function render() {
  if (dragging || (document.activeElement && document.activeElement.id === 'nick')) { pending = true; return; }
  if (!me) { app.innerHTML = viewIssue(); wire(); stopRing(); return; }
  // 状態の変化に合わせて音・振動・通知
  const li = line(), idx = li.indexOf(me.number), ahead = idx >= 0 ? idx : li.filter(n => n < me.number).length;
  const key = me.status === 'waiting' ? (ahead <= WAITING_ROOM ? 'soon' : 'wait') : me.status;
  const changed = st.key !== undefined && st.key !== key;
  if (changed && key === 'soon') { beep(2); vibrate([300, 150, 300]); note('整理券 ' + me.number, 'まもなくご案内です。会場へお越しください'); }
  if (key === 'called' && (st.key !== 'called')) { startRing(); note('整理券 ' + me.number, '順番が来ました。入口前の待合スペースへお越しください'); }
  if (key !== 'called') stopRing();
  if (me.status === 'called' && me.reNotifiedAt != null && st.re != null && st.re !== me.reNotifiedAt) { startRing(); note('整理券 ' + me.number, 'お待ちしています。入口前の待合スペースへお越しください'); }
  st.re = me.reNotifiedAt != null ? me.reNotifiedAt : null; st.key = key;
  app.innerHTML = viewTicket();
  document.title = key === 'called' ? '【順番が来ました】整理券' : '整理券';
  wire(); tick();
}

function wire() {
  const $ = id => document.getElementById(id);
  if ($('nick')) { $('nick').oninput = e => { nick = e.target.value; }; $('nick').onblur = () => { if (pending && !dragging) { pending = false; setTimeout(render, 0); } }; }
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { people = +b.dataset.p; render(); });
  if ($('issue')) $('issue').onclick = () => { ensureAudio(); issue(); };
  if ($('notif')) $('notif').onclick = async () => {
    ensureAudio(); beep(2); soundOn = true;
    try { localStorage.setItem('seiriken-sound', '1'); } catch (e) {}
    try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {}
    $('notif').textContent = '🔔 通知オン（タップで音を確認）';
  };
  if ($('cancel')) $('cancel').onclick = () => {
    if (!confirm('整理券をキャンセルします。\nよろしいですか？（元には戻せません）')) return;
    const ref = db.collection('tickets').doc(me.id), now = Date.now();
    // 新しいルールでは cancelledBy も書ける。古いルールのままでも動くよう、拒否されたら cancelledBy なしでやり直す
    ref.update({ status: 'cancelled', cancelledAt: now, cancelledBy: 'customer' })
      .catch(() => ref.update({ status: 'cancelled', cancelledAt: now }))
      .catch(() => alert('キャンセルできませんでした。もう一度お試しください'));
  };
  if ($('refresh')) $('refresh').onclick = () => { subAll(); };
  if ($('again')) $('again').onclick = leave;
  if ($('another')) $('another').onclick = () => { if (confirm('この端末に表示している整理券を外して、新しい整理券を発行できるようにします。')) leave(); };
  setupTear();
}

/* ---------- 半券をもぎる ---------- */
function setupTear() {
  const tr = document.getElementById('tear'), h = document.getElementById('tearH');
  if (!tr || !h) return;
  const tk = tr.closest('.tk') || tr;
  let sx = 0, drag = false, max = 1, x = 0;
  h.onpointerdown = e => { drag = true; dragging = true; sx = e.clientX; x = 0; tk.classList.remove('snap'); max = Math.max(1, tr.clientWidth - h.offsetWidth - 8); h.setPointerCapture(e.pointerId); };
  h.onpointermove = e => { if (!drag) return; x = Math.max(0, Math.min(max, e.clientX - sx)); h.style.transform = `translateX(${x}px)`; tk.style.setProperty('--p', x / max); if (x / max > 0.05) vibrate(8); };
  const end = () => {
    if (!drag) return; drag = false;
    if (x >= max * 0.85) { tear(tr, tk); return; }
    tk.classList.add('snap'); h.style.transition = 'transform .2s'; h.style.transform = 'translateX(0)'; tk.style.setProperty('--p', 0);
    setTimeout(() => { h.style.transition = ''; tk.classList.remove('snap'); dragging = false; if (pending) { pending = false; render(); } }, 240);
  };
  h.onpointerup = end; h.onpointercancel = end;
}
function tear(tr, tk) {
  stopRing(); ensureAudio(); rip(); vibrate([60, 40, 90]);
  tk.style.setProperty('--p', 1); tk.classList.add('ripped');
  const wait = new Promise(r => setTimeout(r, 750));
  const save = db.collection('tickets').doc(me.id).update({ status: 'inroom', enteredAt: Date.now(), torn: true });
  Promise.all([save, wait])
    .then(() => { dragging = false; pending = false; render(); })
    .catch(() => { alert('もぎれませんでした。もう一度お試しください'); dragging = false; pending = false; render(); });
}

/* ---------- 時計 ---------- */
function tick() { const c = document.getElementById('clk'); if (c) c.textContent = fmtHMS(Date.now()); }
setInterval(tick, 500);

/* ---------- 購読（画面を開き直したときなどに、つなぎ直す） ---------- */
let unsubs = [], lastOk = Date.now();
const stamp = () => { const e = document.getElementById('last'); if (e) e.textContent = fmtHMS(lastOk); };
const okSnap = d => { if (!d.metadata.fromCache) { lastOk = Date.now(); stamp(); } };
function subAll() {
  unsubs.forEach(u => u()); unsubs = [];
  unsubs.push(db.collection('counters').doc(today()).onSnapshot({ includeMetadataChanges: true }, d => { okSnap(d); cfg = d.exists ? d.data() : {}; render(); }));
  unsubs.push(summaryRef().onSnapshot({ includeMetadataChanges: true }, d => { okSnap(d); sum = d.exists ? d.data() : {}; render(); }));
  subMe();
}
// 別のアプリから戻ったときや、通信が復活したときは、つなぎ直して最新の状態を取り直す
document.addEventListener('visibilitychange', () => { if (!document.hidden) subAll(); });
addEventListener('pageshow', e => { if (e.persisted) subAll(); });
addEventListener('online', subAll);
subAll();
</script></body></html>
