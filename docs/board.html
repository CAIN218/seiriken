<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>案内状況</title><link rel="stylesheet" href="style.css?v=5">
<style>main{max-width:1100px;text-align:center}.huge{font-size:clamp(4rem,18vw,14rem);font-weight:800;line-height:1}.chip{font-size:clamp(1.6rem,6vw,4rem);padding:8px 24px}.lab{font-size:clamp(1rem,3vw,2rem);font-weight:700;color:var(--sub)}</style></head>
<body><main>
<div class="card"><div class="lab">現在呼び出し中（待機室へお越しください）</div><div class="huge" id="cur">—</div></div>
<div class="card"><div class="lab">次に呼び出す番号</div><div class="chips" id="up"></div><div class="lab" style="margin-top:12px">待ち <span id="wait">0</span> 組</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=5"></script><script src="common.js?v=5"></script>
<script>
watchTickets(list => {
  document.getElementById('cur').textContent = currentNumber(list) ?? '—';
  document.getElementById('up').innerHTML = upcoming(list, 8).map(t => `<span class="chip">${t.number}</span>`).join('') || '<span class="lab">なし</span>';
  document.getElementById('wait').textContent = list.filter(isActive).length;
});
</script></body></html>
